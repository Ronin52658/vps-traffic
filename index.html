<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPS 流量</title>
<meta name="theme-color" content="#E4E9F0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="VPS 流量">
<script>
// 主题：system（跟随系统）/ light（白天）/ dark（夜间）。在页面绘制前就决定，避免闪一下白屏
(function () {
  var pref = "system";
  try { pref = localStorage.getItem("vt-theme") || "system"; } catch (e) {}
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  var root = document.documentElement;
  function systemDark() {
    // 嵌在别的页面里（例如预览）时，优先看外层给的 data-theme
    var host = root.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host === "dark";
    return !!(mq && mq.matches);
  }
  function apply() {
    var dark = pref === "dark" || (pref === "system" && systemDark());
    root.setAttribute("data-mode", dark ? "dark" : "light");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", dark ? "#1D2129" : "#E4E9F0");
  }
  window.__theme = {
    get: function () { return pref; },
    set: function (v) { pref = v; try { localStorage.setItem("vt-theme", v); } catch (e) {} apply(); }
  };
  apply();
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (pref === "system") apply(); });
  if (window.MutationObserver) new MutationObserver(function () { if (pref === "system") apply(); })
    .observe(root, {attributes: true, attributeFilter: ["data-theme"]});
})();
</script>
<style>
:root{
  --bg:#E4E9F0; --hi:#FFFFFF; --lo:#BFC8D6; --ink:#1F2A37; --muted:#5D6B7C;
  --rx:#3A6FE0; --tx:#E58B33; --danger:#D6453A; --ok:#2FA36B; --line:#D2D9E3;
  --raise:7px 7px 16px var(--lo), -7px -7px 16px var(--hi);
  --raise-sm:3px 3px 7px var(--lo), -3px -3px 7px var(--hi);
  --inset:inset 4px 4px 8px var(--lo), inset -4px -4px 8px var(--hi);
  --inset-sm:inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);
  color-scheme: light;
}
/* ---------- 夜间主题 ----------
   深蓝灰底色，阴影收得更紧、更柔，避免暗色拟物常见的“脏”感；
   强调色调亮一档，进度条和指示灯带一点微光，夜里看更清楚又不刺眼 */
html[data-mode="dark"]{
  --bg:#1D2129; --hi:#272C36; --lo:#12151B; --ink:#E3E8EF; --muted:#8E99A8;
  --rx:#78A6FF; --tx:#FFAE62; --danger:#FF7B70; --ok:#4FD69C; --line:#2C323D;
  --raise:6px 6px 14px var(--lo), -5px -5px 12px var(--hi), inset 0 1px 0 rgba(255,255,255,.035);
  --raise-sm:3px 3px 7px var(--lo), -2px -2px 6px var(--hi), inset 0 1px 0 rgba(255,255,255,.03);
  --inset:inset 4px 4px 9px var(--lo), inset -3px -3px 7px var(--hi);
  --inset-sm:inset 2px 2px 5px var(--lo), inset -2px -2px 4px var(--hi);
  color-scheme: dark;
}
html[data-mode="dark"] body{
  background:radial-gradient(1200px 600px at 15% -10%, #252B36 0%, transparent 60%),
             radial-gradient(900px 500px at 100% 0%, #1F2530 0%, transparent 55%), var(--bg);
  background-attachment:fixed;
}
html[data-mode="dark"] .btn.primary{box-shadow:var(--raise-sm),0 4px 14px color-mix(in srgb,var(--rx) 30%,transparent)}
html[data-mode="dark"] .mini .lv0{box-shadow:0 0 6px color-mix(in srgb,var(--ok) 45%,transparent)}
html[data-mode="dark"] .mini .lv1{box-shadow:0 0 6px color-mix(in srgb,var(--tx) 45%,transparent)}
html[data-mode="dark"] .mini .lv2{box-shadow:0 0 6px color-mix(in srgb,var(--danger) 50%,transparent)}
html[data-mode="dark"] .led.on{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 22%,transparent),0 0 10px var(--ok)}
html[data-mode="dark"] .flag img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) brightness(.92)}
html[data-mode="dark"] .sheet{background:rgba(5,7,10,.55)}
html[data-mode="dark"] .toast{background:#E3E8EF;color:#1D2129}
html[data-mode="dark"] .meter .knob,html[data-mode="dark"] .mini .knob{background:var(--hi)}
html[data-mode="dark"] svg.line path[fill="none"]{filter:drop-shadow(0 0 3px rgba(120,166,255,.18))}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rx);outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:22px 18px 60px}

/* ---------- 基础控件：凸起 / 凹陷 ---------- */
.btn{border:0;background:var(--bg);border-radius:12px;padding:9px 16px;box-shadow:var(--raise-sm);transition:box-shadow .12s}
.btn:active{box-shadow:var(--inset-sm)}
.btn.primary{background:linear-gradient(145deg,var(--rx),color-mix(in srgb,var(--rx) 72%,#000));color:#fff;font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.well{background:var(--bg);border-radius:14px;box-shadow:var(--inset)}
.card{background:var(--bg);border-radius:18px;box-shadow:var(--raise);padding:16px}
input,select{border:0;background:var(--bg);border-radius:10px;padding:10px 12px;box-shadow:var(--inset-sm);width:100%;color:var(--ink)}
input[type=file]{padding:8px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* LED 状态灯 */
.led{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;vertical-align:1px;background:var(--lo);box-shadow:var(--inset-sm)}
.led.on{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 25%,transparent),0 0 8px var(--ok)}

/* ---------- 顶部 ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 26px;flex-wrap:wrap}
header h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.03em}
header .sub{color:var(--muted);font-size:13px;margin-top:8px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:0 4px 16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .knob{width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:1px 1px 3px var(--lo),-1px -1px 3px var(--hi),inset 0 0 0 3px var(--bg),inset 0 0 0 4.5px var(--ink);vertical-align:-2px}

/* ---------- 服务器卡片 ---------- */
.list{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
/* 顶部汇总 */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 0 22px}
.tile{padding:14px 16px;border-radius:16px;background:var(--bg);box-shadow:var(--raise-sm)}
.tile small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.tile strong{font-size:22px;font-weight:700;letter-spacing:.01em}
.tile em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:4px;font-weight:500}
.tile .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
/* 卡片内资源格 */
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:14px 0 12px}
.res .k{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.res .k b{font-weight:650}
.res .k .lbl{color:var(--muted)}
.res .v{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{position:relative;height:9px;border-radius:5px;margin-top:6px;background:var(--bg);box-shadow:var(--inset-sm)}
.mini span{position:absolute;left:2px;top:2px;bottom:2px;border-radius:3px;max-width:calc(100% - 4px)}
.mini .knob{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--bg);box-shadow:1px 1px 3px var(--lo),-1px -1px 3px var(--hi),inset 0 0 0 3px var(--bg),inset 0 0 0 4.5px var(--ink)}
.lv0{background:var(--ok)} .lv1{background:var(--tx)} .lv2{background:var(--danger)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11.5px;color:var(--muted);padding:2px 9px;border-radius:8px;box-shadow:var(--inset-sm);white-space:nowrap}
.tag.warn{color:var(--tx);font-weight:600}
.flag{display:inline-flex;align-items:center}
.flag img{height:18px;width:auto;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.flag .cc{font-size:11px;font-weight:650;color:var(--muted);padding:1px 6px;border-radius:6px;box-shadow:var(--inset-sm)}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio .well{padding:8px 12px;font-size:12.5px;line-height:1.6;border-radius:12px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trio small{display:block;font-size:11px;color:var(--muted)}
.trio .r{color:var(--rx)} .trio .t{color:var(--tx)}
/* 详情：信息格 */
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info .well{padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.info small{display:block;color:var(--muted);font-size:12px}
.info div div{font-size:13.5px;word-break:break-word}
.charts{display:grid;gap:18px;grid-template-columns:1fr;margin-top:18px}
.charts .card{padding:14px}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;font-size:13px}
.chart-title b{font-size:14px}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.lgd i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
svg.line{width:100%;height:auto;display:block;touch-action:pan-y}
.row{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:20px;padding:18px 20px;box-shadow:var(--raise);transition:box-shadow .15s}
.row:active{box-shadow:var(--inset)}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.name{font-weight:650;font-size:16.5px}
.rates{font-size:13px;color:var(--muted)}
.rates b{font-weight:600}
.rates .r{color:var(--rx)} .rates .t{color:var(--tx)}

/* 用量表：凹槽 + 凸起填充 + 时间旋钮 */
.meter{position:relative;height:18px;border-radius:9px;margin:14px 0 10px;background:var(--bg);box-shadow:var(--inset)}
.meter .fill{position:absolute;left:4px;top:4px;bottom:4px;right:4px;display:flex;border-radius:6px;overflow:hidden}
.meter .fill span{height:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.meter .tick{position:absolute;top:3px;bottom:3px;width:2px;border-radius:1px;background:var(--lo)}
.meter .knob{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--bg);box-shadow:2px 2px 5px var(--lo),-2px -2px 5px var(--hi),inset 0 0 0 4px var(--bg),inset 0 0 0 6px var(--ink)}
.meter.over{box-shadow:var(--inset),0 0 0 2px var(--danger)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta .used{color:var(--ink);font-weight:650}
.pace-hot{color:var(--danger);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- 侧滑面板 ---------- */
.sheet{position:fixed;inset:0;background:rgba(20,26,34,.35);display:none;z-index:10}
.sheet.open{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(660px,100%);background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 40px);
  box-shadow:-10px 0 30px rgba(0,0,0,.18);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.panel h2{margin:0;font-size:22px}
.panel .card + .card{margin-top:18px}

/* 分段选择：凹槽里一个凸起滑块 */
.seg{display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--bg);box-shadow:var(--inset);overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:10px;padding:7px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:var(--raise-sm)}
.tabs{margin:20px 0}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:4px 0 4px}
.stats div{padding:12px 14px}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats strong{font-size:18px;font-weight:650}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.readout{font-size:13px;color:var(--muted);min-height:20px;margin:6px 0}
.chart-well{padding:10px 8px 4px}
svg.chart{width:100%;height:auto;display:block}
svg.chart rect.hit{fill:transparent;cursor:pointer}
svg.chart rect.hit:hover{fill:color-mix(in srgb,var(--lo) 40%,transparent)}
svg.chart .bar,svg.chart text{pointer-events:none}

/* 日期区间 */
.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.range-row .to{padding-bottom:10px;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.chip{border:0;background:var(--bg);border-radius:20px;padding:6px 13px;font-size:13px;box-shadow:var(--raise-sm)}
.chip:active,.chip.on{box-shadow:var(--inset-sm);color:var(--rx)}

/* 表格 */
.table-wrap{overflow-x:auto;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:140px}
th{color:var(--muted);font-weight:500}
tr.current td,tr.total td{font-weight:650}
tr.total td{border-bottom:0}
.badge{white-space:nowrap;display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;color:var(--muted);box-shadow:var(--inset-sm);margin-left:6px}

form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
details.alt{margin-top:12px}
details.alt summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:4px 0}
details.alt[open] summary{margin-bottom:6px}
pre.cmd{user-select:all;-webkit-user-select:all;border-radius:12px;box-shadow:var(--inset-sm);padding:12px;white-space:pre-wrap;word-break:break-all;font-size:12px;margin:8px 0 12px}
h3{font-size:15px;margin:0 0 6px}
.order{display:grid;gap:10px}
.order-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;box-shadow:var(--inset-sm)}
.order-name{display:flex;align-items:center;gap:8px;min-width:0}
.order-name > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.sq{padding:5px 10px;min-width:36px}
.order .actions{flex-wrap:nowrap;gap:8px}

/* 分组 */
.grp-bar{margin:0 0 18px;flex-wrap:wrap}
.grp-bar[hidden]{display:none}   /* .seg 的 display:flex 会盖过 hidden 属性 */
.grp-bar button{flex:0 0 auto}
.grp-bar button small{color:var(--muted);font-weight:400;margin-left:4px}

/* 延迟监测 */
.lat-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.lat-bar .seg{flex:1 1 auto;flex-wrap:wrap}
.lat-bar .seg button{padding:7px 10px}
.lat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}
.lat-card{position:relative;text-align:left;border:0;background:var(--bg);border-radius:14px;box-shadow:var(--raise-sm);padding:12px 14px 12px 22px;cursor:pointer;min-width:0}
.lat-card i.c{position:absolute;left:10px;top:13px;bottom:13px;width:4px;border-radius:3px}
.lat-card b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px}
.lat-card .v{font-size:13px;color:var(--muted);margin-top:4px}
.lat-card .v.bad{color:var(--danger)}
.lat-card .tip{position:absolute;right:12px;top:10px;color:var(--muted);font-size:13px}
.lat-card.off{box-shadow:var(--inset-sm);opacity:.5}
.lat-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.lat-tools .btn.on{box-shadow:var(--inset-sm);color:var(--rx);font-weight:600}
.lat-tip{font-size:12.5px;color:var(--muted);min-height:18px;margin-top:6px;line-height:1.7}
.lat-tip span{white-space:nowrap;margin-right:12px}
.lat-tip i,.lgd i.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.lat-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 10px 10px 14px;border-radius:12px;box-shadow:var(--inset-sm)}
.lat-row .t{min-width:0}
.lat-row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lat-row .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:260px;overflow:auto;padding:4px}
.checks label{display:flex;align-items:center;gap:8px;flex-direction:row;color:var(--ink);font-size:13.5px;padding:6px 10px;border-radius:10px;box-shadow:var(--inset-sm);cursor:pointer}
.checks input{width:auto;box-shadow:none;margin:0;accent-color:var(--rx)}
@media (max-width:420px){.lat-cards{grid-template-columns:1fr}}

/* 登录 */
.login{max-width:340px;margin:16vh auto;padding:0 18px}
.login .card{padding:26px}
.login h1{font-size:28px;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:14px;z-index:20;display:none}
@media (max-width:420px){.wrap{padding:18px 14px 50px}.row{padding:16px}.grid2{grid-template-columns:1fr}.tile strong{font-size:19px}}
</style>
</head>
<body>

<div id="loginView" class="login" hidden>
  <div class="card">
    <h1 class="siteName">VPS 流量</h1>
    <p class="hint" style="margin-bottom:18px">请输入面板密码</p>
    <form id="loginForm">
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr"></p>
      <button class="btn primary" type="submit">登录</button>
    </form>
  </div>
</div>

<div id="mainView" class="wrap" hidden>
  <header>
    <div>
      <h1 class="siteName">VPS 流量</h1>
    </div>
    <div class="actions">
      <button class="btn" id="rangeBtn">区间统计</button>
      <button class="btn" id="settingsBtn">设置</button>
    </div>
  </header>
  <div class="seg grp-bar" id="groupBar" hidden></div>
  <div class="tiles num" id="tilesTop"></div>
  <div class="legend">
    <span><i style="background:var(--rx)"></i>下行</span>
    <span><i style="background:var(--tx)"></i>上行</span>
    <span><i class="knob"></i>流量周期时间进度</span>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="sheet" id="sheet">
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const BILLING = {sum:"双向相加", out:"仅上行", in:"仅下行", max:"取较大方向"};
let META = {}, SERVERS = [], CUR = null, TAB = "monitor", MRANGE = "live", lastCharts = 0, RANGE = 30, timer = null, chartSeq = 0;
let DRANGE = null;   // 详情页区间 {start, end}
let GRANGE = null;   // 区间统计 {start, end}

async function api(path, opt = {}) {
  const r = await fetch(path, {credentials:"same-origin", headers:{"Content-Type":"application/json", "X-VT-Request":"1"}, ...opt});
  if (r.status === 401 && path !== "/api/login" && path !== "/api/password") { showLogin(); throw new Error("未登录"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const GiB = 1024 ** 3;
function fb(n) {
  n = Number(n) || 0;
  const u = ["B","KB","MB","GB","TB","PB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(n >= 100 ? 1 : 2)) + " " + u[i];
}
const fr = n => fb(n).replace(/ (\w+)$/, " $1/s");
const pad = n => String(n).padStart(2, "0");
function fd(ts, withTime) {
  if (!ts) return "—";
  // 按面板时区显示，与重置点计算一致
  const s = new Date(ts * 1000).toLocaleString("sv-SE", {timeZone: META.tz || undefined, hour12: false});
  return withTime ? s.slice(0, 16) : s.slice(0, 10);
}
// 零点只显示日期，手动重置等非零点才带时间
function fdc(ts) { const t = fd(ts, true); return t.endsWith("00:00") ? t.slice(0, 10) : t; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2400); }
function ruleText(s) {
  if (s.reset_type === "monthly") return `每月 ${+s.reset_day || 1} 日重置`;
  if (s.reset_type === "interval") return `每 ${+s.interval_days || 30} 天重置（自 ${esc(s.anchor)} 起）`;
  return "手动重置";
}

/* ---------- 日期工具（YYYY-MM-DD，按面板时区） ---------- */
const todayIso = () => fd(Date.now() / 1000);
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000) + 1; }
function monthRange(offset) {
  const [y, m] = todayIso().split("-").map(Number);
  const s = new Date(Date.UTC(y, m - 1 + offset, 1)), e = new Date(Date.UTC(y, m + offset, 0));
  return {start: s.toISOString().slice(0, 10), end: offset === 0 ? todayIso() : e.toISOString().slice(0, 10)};
}
const lastDays = n => ({start: addDays(todayIso(), -(n - 1)), end: todayIso()});
// 周期结束点是下个周期起点的 0 点，所以区间的最后一天要往前推一秒
const cycleRange = c => ({start: fd(c.start), end: c.end ? fd(c.end - 1) : todayIso()});
const rangeLabel = r => `${r.start} 至 ${r.end}（${daysBetween(r.start, r.end)} 天）`;

/* ---------- 用量表 ---------- */
function meter(s) {
  const c = s.cycle, quota = s.quota_gb * GiB;
  const now = Date.now() / 1000;
  let timePct = null;
  if (c.end) timePct = Math.min(100, Math.max(0, (now - c.start) / (c.end - c.start) * 100));
  let parts;
  const scale = quota > 0 ? quota : Math.max(c.used, 1);
  if (s.billing === "sum") parts = [["rx", c.rx], ["tx", c.tx]];
  else if (s.billing === "out") parts = [["tx", c.tx]];
  else if (s.billing === "in") parts = [["rx", c.rx]];
  else parts = c.rx >= c.tx ? [["rx", c.rx]] : [["tx", c.tx]];
  const pct = quota > 0 ? c.used / quota * 100 : null;
  const fills = parts.map(([k, v]) => `<span style="width:${Math.min(100, v / scale * 100)}%;background:var(--${k})"></span>`).join("");
  const ticks = quota > 0 ? [80, 95].map(p => `<span class="tick" style="left:calc(4px + (100% - 8px) * ${p / 100})"></span>`).join("") : "";
  const knob = timePct !== null && quota > 0 ? `<span class="knob" style="left:calc(4px + (100% - 8px) * ${timePct / 100})" title="周期时间已过 ${timePct.toFixed(0)}%"></span>` : "";
  const hot = pct !== null && timePct !== null && pct > timePct + 10 && pct > 20;
  const daysLeft = c.end ? Math.max(0, Math.ceil((c.end - now) / 86400)) : null;
  return `
    ${quota > 0 ? `<div class="meter${pct >= 100 ? " over" : ""}"><div class="fill">${fills}</div>${ticks}${knob}</div>` : `<div style="height:12px"></div>`}
    <div class="meta num">
      <span><span class="used">${fb(c.used)}</span>${quota > 0 ? ` / ${+s.quota_gb} GB（<span class="${hot ? "pace-hot" : ""}">${pct.toFixed(1)}%</span>）` : "（未设额度）"}</span>
      <span>${daysLeft !== null ? `${daysLeft} 天后重置（${fd(c.end)}）` : "手动重置"}</span>
    </div>`;
}

/* ---------- 卡片与汇总 ---------- */
// 国旗用图片（Windows 上的浏览器不显示国旗 emoji）；图片加载失败时显示两位代码
const flagSrc = cc => `/flags/${cc.toLowerCase()}.png`;
const flag = cc => /^[A-Z]{2}$/.test(cc || "")
  ? `<img src="${flagSrc(cc)}" alt="${cc}" title="${cc}" loading="lazy" onerror="this.outerHTML='<span class=&quot;cc&quot;>${cc}</span>'">` : "";
const lv = p => p >= 90 ? "lv2" : p >= 70 ? "lv1" : "lv0";
const pctOf = (u, t) => t > 0 ? u / t * 100 : 0;
const clamp = v => Math.min(100, Math.max(0, v));
function upText(sec) {
  if (sec == null) return "";
  const d = Math.floor(sec / 86400), h = Math.floor(sec / 3600);
  return d >= 1 ? `在线 ${d} 天` : h >= 1 ? `在线 ${h} 小时` : `在线 ${Math.max(1, Math.floor(sec / 60))} 分钟`;
}
function durText(sec) {
  if (sec == null) return "—";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return (d ? `${d} 天 ` : "") + (d || h ? `${h} 小时 ` : "") + `${m} 分钟`;
}
const shortOs = os => (os || "").replace("GNU/Linux ", "").replace(/ \(.*\)$/, "");
const mini = (p, cls) => `<div class="mini"><span class="${cls}" style="width:calc((100% - 4px) * ${clamp(p) / 100})"></span></div>`;

function cycleInfo(s) {
  const c = s.cycle, quota = s.quota_gb * GiB, now = Date.now() / 1000;
  const pct = quota > 0 ? c.used / quota * 100 : null;
  const timePct = c.end ? clamp((now - c.start) / (c.end - c.start) * 100) : null;
  const hot = pct !== null && timePct !== null && pct > timePct + 10 && pct > 20;
  const daysLeft = c.end ? Math.max(0, Math.ceil((c.end - now) / 86400)) : null;
  return {c, quota, pct, timePct, hot, daysLeft};
}

function resCell(label, pct, valText, sub) {
  return `<div><div class="k"><span class="lbl">${label}</span><b>${pct == null ? "—" : pct.toFixed(1) + "%"}</b></div>
    ${mini(pct || 0, lv(pct || 0))}<div class="v">${sub}</div></div>`;
}

function card(s) {
  const y = s.online ? s.sys : null, i = s.info || {}, k = cycleInfo(s);
  const memP = y && y.mem_total ? pctOf(y.mem_used, y.mem_total) : null;
  const diskP = y && y.disk_total ? pctOf(y.disk_used, y.disk_total) : null;
  const trafficBar = k.quota > 0
    ? `<div class="mini"><span class="${k.hot ? "lv2" : lv(k.pct)}" style="width:calc((100% - 4px) * ${clamp(k.pct) / 100})"></span>${k.timePct !== null ? `<span class="knob" style="left:calc(2px + (100% - 4px) * ${k.timePct / 100})"></span>` : ""}</div>`
    : `<div class="mini"></div>`;
  const tags = [
    s.online ? (y ? upText(y.uptime) : "在线") : (s.last_seen ? `离线 ${fd(s.last_seen, true).slice(5)}` : "尚未上报"),
    shortOs(i.os), i.cores ? `${i.cores} 核` : "",
  ].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")
    + (s.agent_outdated ? `<span class="tag warn" title="这台的 Agent 不是当前版本。在这台 VPS 上运行仓库里的 update.sh 升级（见 README“更新 Agent”）">Agent 需更新</span>` : "");
  return `
    <button class="row" data-id="${s.id}">
      <div class="row-head">
        <span class="name"><span class="led ${s.online ? "on" : ""}"></span>${esc(s.name)}</span>
        <span class="flag">${flag(s.country)}</span>
      </div>
      <div class="chiprow">${tags}</div>
      <div class="res num">
        ${resCell("CPU", y ? y.cpu : null, "", y ? y.load.map(v => v == null ? "-" : v.toFixed(2)).join("　") : "—")}
        ${resCell("内存", memP, "", y ? `${fb(y.mem_used)} / ${fb(y.mem_total)}` : "—")}
        ${resCell("硬盘", diskP, "", y ? `${fb(y.disk_used)} / ${fb(y.disk_total)}` : "—")}
        <div><div class="k"><span class="lbl">流量</span><b class="${k.hot ? "pace-hot" : ""}">${k.pct == null ? "∞" : k.pct.toFixed(1) + "%"}</b></div>
          ${trafficBar}<div class="v">${fb(k.c.used)} / ${k.quota > 0 ? +s.quota_gb + " GB" : "∞"}</div></div>
      </div>
      <div class="trio num">
        <div class="well"><small>实时网速</small><span class="r">↓ ${s.online ? fr(s.rate_rx) : "—"}</span><br><span class="t">↑ ${s.online ? fr(s.rate_tx) : "—"}</span></div>
        <div class="well"><small>本周期累计</small><span class="r">↓ ${fb(k.c.rx)}</span><br><span class="t">↑ ${fb(k.c.tx)}</span></div>
      </div>
      <div class="meta num" style="margin-top:10px"><span>${k.daysLeft !== null ? `${k.daysLeft} 天后重置（${fd(k.c.end)}）` : "手动重置"}</span><span>${BILLING[s.billing]}</span></div>
    </button>`;
}

/* ---------- 分组：首页只显示当前分组的服务器，顶部汇总也只算这些 ---------- */
let GROUPS = [], GROUP = 0;
try { GROUP = +localStorage.getItem("vt-group") || 0; } catch (e) {}
const curGroup = () => GROUPS.find(g => g.id === GROUP) || null;
const visibleServers = () => { const g = curGroup(); return g ? SERVERS.filter(s => g.servers.includes(s.id)) : SERVERS; };
async function loadGroups() {
  try { GROUPS = await api("/api/groups"); } catch (e) { GROUPS = []; }
  if (GROUP && !curGroup()) GROUP = 0;
  renderGroupBar();
}
function renderGroupBar() {
  const bar = $("#groupBar"); if (!bar) return;
  bar.hidden = !GROUPS.length;
  if (!GROUPS.length) return;
  const cnt = g => g ? SERVERS.filter(s => g.servers.includes(s.id)).length : SERVERS.length;
  const html = [[0, "全部", null], ...GROUPS.map(g => [g.id, g.name, g])].map(([id, n, g]) =>
    `<button data-g="${id}" class="${GROUP === id ? "on" : ""}">${esc(n)}<small class="num">${cnt(g)}</small></button>`).join("");
  // 首页每几秒刷新一次：内容没变就不重绘，免得正好点下去时按钮被替换、点击丢失
  if (bar.dataset.html === html) return;
  bar.dataset.html = html; bar.innerHTML = html;
  bar.querySelectorAll("button").forEach(b => b.onclick = () => {
    GROUP = +b.dataset.g;
    try { localStorage.setItem("vt-group", String(GROUP)); } catch (e) {}
    renderList();
  });
}

function renderTiles() {
  const SV = visibleServers(), g = curGroup(), scope = g ? `“${esc(g.name)}”合计` : "全部服务器合计";
  const on = SV.filter(s => s.online), sum = f => on.reduce((a, s) => a + (f(s) || 0), 0);
  const sys = on.filter(s => s.sys);
  const mu = sys.reduce((a, s) => a + s.sys.mem_used, 0), mt = sys.reduce((a, s) => a + s.sys.mem_total, 0);
  const du = sys.reduce((a, s) => a + s.sys.disk_used, 0), dt = sys.reduce((a, s) => a + s.sys.disk_total, 0);
  const tr = SV.reduce((a, s) => a + s.today.rx, 0), tt = SV.reduce((a, s) => a + s.today.tx, 0);
  const split = t => { const m = t.match(/^([\d.]+) (.+)$/); return m ? `${m[1]}<em>${m[2]}</em>` : t; };
  const tiles = [
    ["在线", `${on.length}<em>台</em>`, "", `共 ${SV.length} 台`],
    ["实时下行", split(fr(sum(s => s.rate_rx))), "rx", scope],
    ["实时上行", split(fr(sum(s => s.rate_tx))), "tx", scope],
    ["今日流量", split(fb(tr + tt)), "", `↓ ${fb(tr)}　↑ ${fb(tt)}`],
    ["内存用量", split(fb(mu)), "", `共 ${fb(mt)}`],
    ["硬盘用量", split(fb(du)), "", `共 ${fb(dt)}`],
  ];
  $("#tilesTop").innerHTML = tiles.map(([k, v, c, sub]) => `<div class="tile"><small>${k}</small><strong${c ? ` style="color:var(--${c})"` : ""}>${v}</strong><div class="sub">${sub}</div></div>`).join("");
}

function renderList() {
  const el = $("#list"), SV = visibleServers();
  renderGroupBar();
  el.innerHTML = SV.length ? SV.map(card).join("")
    : SERVERS.length ? `<div class="card empty">“${esc(curGroup().name)}”分组里还没有服务器。到“设置”→“分组”里添加。</div>`
    : `<div class="card empty">还没有服务器。打开“设置”，点击“新增服务器”获取安装命令，在 VPS 上运行后即开始统计。</div>`;
  el.querySelectorAll(".row").forEach(b => b.onclick = () => openDetail(+b.dataset.id));
  renderTiles();
}

async function refresh(quiet) {
  try { SERVERS = await api("/api/servers"); renderList(); } catch (e) { if (!quiet && e.message !== "未登录") toast(e.message); }
}

/* ---------- 图表 ---------- */
function barChart(data, labelFn, onPick) {
  const id = "c" + (++chartSeq);
  const W = 600, H = 220, padL = 4, padB = 28, n = data.length;
  const max = Math.max(1, ...data.map(d => d.rx + d.tx));
  const bw = (W - padL) / n, gap = Math.min(4, bw * 0.25);
  const step = Math.ceil(n / 6);
  let bars = "", hits = "", labels = "";
  data.forEach((d, i) => {
    const x = padL + i * bw + gap / 2, w = Math.max(0.6, bw - gap);
    const hr = (d.rx / max) * (H - padB - 24), ht = (d.tx / max) * (H - padB - 24);
    const yb = H - padB, r = Math.min(3, w / 2);
    bars += `<rect class="bar" x="${x}" y="${yb - hr}" width="${w}" height="${hr}" fill="var(--rx)"/>`;
    bars += `<rect class="bar" x="${x}" y="${yb - hr - ht}" width="${w}" height="${ht}" rx="${ht > r * 2 ? r : 0}" fill="var(--tx)"/>`;
    hits += `<rect class="hit" data-i="${i}" x="${padL + i * bw}" y="0" width="${bw}" height="${H - padB}"/>`;
    if (i % step === 0) labels += `<text x="${x + w / 2}" y="${H - 6}" font-size="17" text-anchor="middle" fill="var(--muted)">${labelFn(d)}</text>`;
  });
  setTimeout(() => document.querySelectorAll(`#${id} rect.hit`).forEach(r => {
    const f = () => onPick(data[+r.dataset.i]);
    r.onmouseenter = f; r.onclick = f;
  }));
  return `<div class="well chart-well"><svg id="${id}" class="chart" viewBox="0 0 ${W} ${H}" role="img">${hits}${bars}${labels}
    <text x="${W - 2}" y="16" font-size="16" text-anchor="end" fill="var(--muted)">峰值 ${fb(max)}</text></svg></div>`;
}

function statWells(items) {
  return `<div class="stats num">${items.map(([k, v, color]) =>
    `<div class="well"><small>${k}</small><strong${color ? ` style="color:var(--${color})"` : ""}>${v}</strong></div>`).join("")}</div>`;
}

/* ---------- 侧滑面板 ---------- */
function openSheet(html) {
  $("#sheet").classList.add("open"); document.body.style.overflow = "hidden";
  $("#panel").innerHTML = html; $("#panel").scrollTop = 0;
  const c = $("#closeBtn"); if (c) c.onclick = closeSheet;
}
function closeSheet() {
  $("#sheet").classList.remove("open"); document.body.style.overflow = ""; CUR = null; refresh();
}
const panelTop = title => `<div class="panel-top"><h2>${title}</h2><button class="btn" id="closeBtn">关闭</button></div>`;

async function openDetail(id) {
  CUR = id; TAB = "monitor"; MRANGE = "live"; DRANGE = null;
  openSheet("");
  await renderDetail();
}

// 详情页顶部：实时网速、用量条、统计，定时刷新时只重绘这一块，不打断下方的图表和表单
function detailHead(s) {
  const c = s.cycle;
  return `
    <div class="meta num" style="justify-content:flex-start;gap:14px">
      <span>${ruleText(s)}</span><span>${BILLING[s.billing]}</span>${s.iface ? `<span>网卡 ${esc(s.iface)}</span>` : ""}${s.hostname ? `<span>${esc(s.hostname)}</span>` : ""}
    </div>
    <div class="stats num" style="margin-top:14px">
      <div class="well"><small>实时下行</small><strong style="color:var(--rx)">${s.online ? fr(s.rate_rx) : "—"}</strong></div>
      <div class="well"><small>实时上行</small><strong style="color:var(--tx)">${s.online ? fr(s.rate_tx) : "—"}</strong></div>
    </div>
    ${meter(s)}
    ${statWells([["本周期下行", fb(c.rx), "rx"], ["本周期上行", fb(c.tx), "tx"], ["今日下行", fb(s.today.rx)], ["今日上行", fb(s.today.tx)]])}`;
}
async function updateDetailHead() {
  const id = CUR;
  const s = await api(`/api/servers/${id}`);
  if (id !== CUR || !$("#dHead")) return;
  $("#dHead").innerHTML = detailHead(s);
  const led = $("#panel .panel-top .led"); if (led) led.className = "led" + (s.online ? " on" : "");
  if (TAB === "monitor" && $("#mInfo")) {
    $("#mInfo").innerHTML = monitorInfo(s);
    // 实时图每次刷新；历史区间一分钟刷新一次即可
    if (MRANGE === "live" || Date.now() - lastCharts > 60000) await loadCharts();
  }
  // 延迟数据每分钟才有新点，一分钟刷新一次；自定义区间不自动刷新
  if (TAB === "latency" && LAT.range !== "custom" && Date.now() - LAT.loaded > 60000) await loadLatency();
}

async function renderDetail() {
  let s;
  try { s = await api(`/api/servers/${CUR}`); } catch (e) { toast(e.message); return closeSheet(); }
  $("#panel").innerHTML = `
    ${panelTop(`<span class="led ${s.online ? "on" : ""}"></span>${esc(s.name)} <span class="flag">${flag(s.country)}</span>`)}
    <div id="dHead">${detailHead(s)}</div>
    <div class="seg tabs" role="tablist">
      ${[["monitor","监控"],["latency","延迟"],["daily","每日"],["range","区间"],["cycles","周期"],["settings","设置"]].map(([k,v]) =>
        `<button role="tab" data-tab="${k}" class="${TAB === k ? "on" : ""}">${v}</button>`).join("")}
    </div>
    <div id="tabBody"></div>`;
  $("#closeBtn").onclick = closeSheet;
  $("#panel").querySelectorAll(".tabs button").forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderDetail(); });
  if (TAB === "monitor") await tabMonitor(s);
  else if (TAB === "latency") await tabLatency();
  else if (TAB === "daily") await tabDaily();
  else if (TAB === "range") await tabRange(s);
  else if (TAB === "cycles") await tabCycles();
  else tabSettings(s);
}

/* ---------- 监控：系统信息 + 折线图 ---------- */
function monitorInfo(s) {
  const y = s.online ? s.sys : null, i = s.info || {};
  const cell = (k, v) => `<div class="well"><small>${k}</small><div>${v ? esc(v) : "—"}</div></div>`;
  const sysItems = [
    ["系统", i.os], ["内核", i.kernel],
    ["CPU", i.cpu_model ? `${i.cpu_model}（${i.cores} 核）` : ""],
    ["架构 / 虚拟化", [i.arch, i.virt && i.virt !== "none" ? i.virt : (i.virt === "none" ? "物理机" : "")].filter(Boolean).join(" / ")],
    ...(s.ip4 || s.ip6 ? [["IPv4", s.ip4], ["IPv6", s.ip6]] : [["IP", s.ip]]),
    ["Agent 版本", s.last_seen ? `${s.agent_ver || "旧版"}${s.agent_outdated ? "（需更新）" : "（最新）"}` : ""], ["运行时间", y ? durText(y.uptime) : ""], ["主机名", s.hostname], ["网卡", s.iface],
  ];
  const nowItems = [
    ["CPU", y && y.cpu != null ? `${y.cpu.toFixed(1)}%` : ""],
    ["负载", y ? y.load.map(v => v == null ? "-" : v.toFixed(2)).join(" / ") : ""],
    ["内存", y ? `${fb(y.mem_used)} / ${fb(y.mem_total)}（${pctOf(y.mem_used, y.mem_total).toFixed(1)}%）` : ""],
    ["Swap", y ? (y.swap_total ? `${fb(y.swap_used)} / ${fb(y.swap_total)}` : "未启用") : ""],
    ["硬盘", y ? `${fb(y.disk_used)} / ${fb(y.disk_total)}（${pctOf(y.disk_used, y.disk_total).toFixed(1)}%）` : ""],
    ["网络连接", y ? `TCP ${y.tcp}，UDP ${y.udp}` : ""], ["进程", y ? String(y.procs) : ""],
  ];
  return `

function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * e >= v) return m * e;
  return 10 * e;
}
function lineChart(pts, series, fmt, opt, rng) {
  const id = "l" + (++chartSeq);
  const W = 600, H = 220, L = 86, R = 10, T = 26, B = 28;
  const x0 = pts[0].ts, x1 = pts[pts.length - 1].ts;
  const vals = series.flatMap(([k]) => pts.map(p => +p[k] || 0));
  const ymax = opt.max ?? niceMax(Math.max(0, ...vals) * 1.05);
  const X = t => L + (t - x0) / Math.max(1, x1 - x0) * (W - L - R);
  const Y = v => T + (1 - Math.min(v, ymax) / ymax) * (H - T - B);
  let grid = "", xl = "", lines = "";
  for (let i = 0; i <= 4; i++) {
    const v = ymax * i / 4, y = Y(v);
    grid += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`
      + `<text x="${L - 8}" y="${y + 5}" font-size="14" text-anchor="end" fill="var(--muted)">${fmt(v)}</text>`;
  }
  const tl = t => rng === "7d" ? fd(t, true).slice(5, 10) : rng === "multi" ? fd(t, true).slice(5, 16) : fd(t, true).slice(11, 16);
  for (let i = 0; i <= 4; i++) {
    const t = x0 + (x1 - x0) * i / 4;
    xl += `<text x="${X(t)}" y="${H - 6}" font-size="14" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}" fill="var(--muted)">${tl(t)}</text>`;
  }
  series.forEach(([k, , color, dash], si) => {
    let d = "", pen = false;
    for (const p of pts) {
      const v = p[k];
      if (v == null) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${X(p.ts).toFixed(1)},${Y(+v).toFixed(1)}`; pen = true;
    }
    if (opt.area && si === 0 && d)
      lines += `<path d="${d}L${X(x1).toFixed(1)},${Y(0)}L${X(x0).toFixed(1)},${Y(0)}Z" fill="${color}" opacity=".12"/>`;
    lines += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"${dash ? ' stroke-dasharray="6 5" opacity=".6"' : ""}/>`;
  });
  setTimeout(() => {
    const svg = document.getElementById(id); if (!svg) return;
    const guide = svg.querySelector(".guide"), tip = svg.querySelector(".tip");
    const move = e => {
      const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
      if (vx < L || vx > W - R) return;
      const t = x0 + (vx - L) / (W - L - R) * (x1 - x0);
      let p = pts[0]; for (const q of pts) if (Math.abs(q.ts - t) < Math.abs(p.ts - t)) p = q;
      guide.setAttribute("x1", X(p.ts)); guide.setAttribute("x2", X(p.ts)); guide.style.display = "";
      if (opt.onTip) return opt.onTip(p);
      tip.textContent = `${fd(p.ts, true).slice(5)}　` + series.filter(s => !s[3]).map(([k, n]) => `${n} ${p[k] == null ? "-" : fmt(+p[k])}`).join("　");
    };
    svg.onpointermove = move; svg.onpointerdown = move;
    svg.onpointerleave = () => { guide.style.display = "none"; tip.textContent = ""; if (opt.onTip) opt.onTip(null); };
  });
  return `<svg id="${id}" class="line" viewBox="0 0 ${W} ${H}" role="img">${grid}${xl}${lines}
    <line class="guide" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity=".5" style="display:none"/>
    <text class="tip" x="${L}" y="16" font-size="14" fill="var(--ink)"></text></svg>`;
}

// Agent 从 GitHub 固定提交安装：先下载 install.sh 并校验 SHA256，通过才运行；install.sh 再校验 agent.sh
// 下载命令：有 curl 用 curl，只有 wget 的精简系统用 wget（很多 VPS 模板默认不带 curl）
const dlCmd = (f, url) => `if command -v curl >/dev/null; then curl -fsSL --proto '=https' -o ${f} ${url}; else wget -q --https-only -O ${f} ${url}; fi`;
function installCmd(token) {
  const b = META.base_url, a = META.agent;
  if (!a) return "# 面板没有配置 Agent 固定版本（agent_pin.json），无法生成安装命令";
  const f = "/root/vps-traffic-install.sh";
  return [
    dlCmd(f, `https://raw.githubusercontent.com/${a.repo}/${a.commit}/install.sh`),
    `echo "${a.install_sha256}  ${f}" | sha256sum -c - && sh ${f} --ref ${a.commit} --server '${b}' --token ${token} --interval ${META.interval || 3}`,
    `rm -f ${f}`,
  ].join("\n");
}
// VPS 连不上 GitHub 时的两种装法：手动上传文件 / 经镜像下载。两种都照样校验 SHA256
const MIRROR = "https://ghfast.top/";
function altInstallHtml(token) {
  const b = META.base_url, a = META.agent;
  if (!a) return "";
  const raw = `https://raw.githubusercontent.com/${a.repo}/${a.commit}`, iv = META.interval || 3;
  const dl = `curl -fsSLO ${raw}/install.sh\ncurl -fsSLO ${raw}/agent.sh`;
  const off = `cd /root && echo "${a.install_sha256}  install.sh" | sha256sum -c - && sh install.sh --agent-file agent.sh --server '${b}' --token ${token} --interval ${iv} && rm -f install.sh agent.sh`;
  const f = "/root/vps-traffic-install.sh";
  const mir = [
    dlCmd(f, `${MIRROR}${raw}/install.sh`),
    `echo "${a.install_sha256}  ${f}" | sha256sum -c - && sh ${f} --ref ${a.commit} --mirror ${MIRROR} --server '${b}' --token ${token} --interval ${iv}`,
    `rm -f ${f}`,
  ].join("\n");
  return `<details class="alt">
    <summary>VPS 连不上 GitHub？</summary>
    <p class="hint"><b>方法一：手动上传（完全不需要访问 GitHub）</b><br>① 在能访问 GitHub 的机器上（比如面板机器）下载这两个文件：</p>
    <pre class="cmd" id="altDl">${esc(dl)}</pre>
    <p class="hint">② 把 <code>install.sh</code> 和 <code>agent.sh</code> 传到 VPS 的 <code>/root/</code>，例如 <code>scp install.sh agent.sh root@VPS地址:/root/</code><br>③ 在 VPS 上用 root 运行：</p>
    <pre class="cmd" id="altOff">${esc(off)}</pre>
    <div class="actions"><button class="btn" data-copy="altOff">复制第 ③ 步命令</button></div>
    <p class="hint" style="margin-top:14px"><b>方法二：经镜像下载</b>（镜像是第三方服务，可能失效；下载的文件照样校验 SHA256，镜像改不了内容）</p>
    <pre class="cmd" id="altMir">${esc(mir)}</pre>
    <div class="actions"><button class="btn" data-copy="altMir">复制镜像命令</button></div>
  </details>`;
}
function fillAltInstall(el, token) {
  el.innerHTML = altInstallHtml(token);
  el.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copyText($("#" + btn.dataset.copy).textContent));
}
// navigator.clipboard 只在 HTTPS 或 localhost 下可用；用 IP:端口 访问时退回到 execCommand
function copyText(t) {
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  };
  const done = ok => {
    if (ok) return toast("已复制命令");
    const pre = $("#cmd");
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    toast("浏览器不允许自动复制，已帮你选中命令，请长按或 Ctrl+C 复制");
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(t).then(() => done(true), () => done(fallback()));
  else done(fallback());
}

/* ---------- 延迟监测：详情页“延迟”分页 ---------- */
const LAT_COLORS = ["#E5534B", "#3FB8AF", "#8E7CF0", "#4C8DF6", "#F0A43C", "#2FA36B", "#D45FA8", "#9AAE3A", "#E57A2E", "#5B6CD9"];
const LAT_RANGES = [["1h", "1 小时"], ["6h", "6 小时"], ["12h", "12 小时"], ["24h", "1 天"], ["7d", "7 天"], ["30d", "30 天"], ["custom", "自定义"]];
const LAT = {range: "1h", hidden: new Set(), smooth: false, loaded: 0, data: null, start: null, end: null};
const latColor = i => LAT_COLORS[i % LAT_COLORS.length];
const fms = v => v == null ? "—" : (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + "ms";
const latTarget = t => t.kind === "tcp" ? `TCP ${t.host.includes(":") ? `[${t.host}]` : t.host}:${t.port}` : `ICMP ${t.host}`;
// 自定义区间的时间按面板时区填写和解读，与图表横轴一致（浏览器所在时区可能不同）
const tzOff = ts => (Date.parse(new Date(ts * 1000).toLocaleString("sv-SE", {timeZone: META.tz || undefined}).replace(" ", "T") + "Z") - ts * 1000) / 1000;
const toLocalInput = ts => new Date((ts + tzOff(ts)) * 1000).toISOString().slice(0, 16);
const fromLocalInput = v => { const t = Date.parse(v + ":00Z") / 1000; return t - tzOff(t); };

async function tabLatency() {
  const now = Math.floor(Date.now() / 1000);
  LAT.start = LAT.start || now - 86400; LAT.end = LAT.end || now;
  $("#tabBody").innerHTML = `
    <div class="lat-bar">
      <div class="seg" id="latRange">${LAT_RANGES.map(([k, v]) => `<button data-r="${k}" class="${LAT.range === k ? "on" : ""}">${v}</button>`).join("")}</div>
    </div>
    <form id="latCustom" class="range-row" style="margin-top:14px;${LAT.range === "custom" ? "" : "display:none"}">
      <label>开始（${esc(META.tz || "")}）<input type="datetime-local" name="s" value="${toLocalInput(LAT.start)}"></label><span class="to">至</span>
      <label>结束<input type="datetime-local" name="e" value="${toLocalInput(LAT.end)}"></label>
      <button class="btn primary" type="submit" style="grid-column:1/-1">查询</button>
    </form>
    <div id="latBody"><div class="card empty" style="margin-top:18px">载入中…</div></div>`;
  $("#latRange").querySelectorAll("button").forEach(b => b.onclick = () => {
    LAT.range = b.dataset.r;
    $("#latRange").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    $("#latCustom").style.display = LAT.range === "custom" ? "" : "none";
    loadLatency();
  });
  $("#latCustom").onsubmit = e => {
    e.preventDefault();
    const s = fromLocalInput(e.target.s.value), en = fromLocalInput(e.target.e.value);
    if (!(s < en)) return toast("结束时间要晚于开始时间");
    LAT.start = Math.floor(s); LAT.end = Math.floor(en); loadLatency();
  };
  await loadLatency();
}

async function loadLatency() {
  const id = CUR;
  const q = LAT.range === "custom" ? `range=custom&start=${LAT.start}&end=${LAT.end}` : `range=${LAT.range}`;
  let d;
  try { d = await api(`/api/servers/${id}/latency?${q}`); } catch (e) { if ($("#latBody")) $("#latBody").innerHTML = `<div class="card empty" style="margin-top:18px">${esc(e.message)}</div>`; return; }
  if (id !== CUR || TAB !== "latency" || !$("#latBody")) return;
  LAT.loaded = Date.now(); LAT.data = d;
  renderLatency();
}

// 平滑峰值：5 点滑动中位数，压掉偶发尖刺，看趋势更清楚
function smooth(vals) {
  return vals.map((v, i) => {
    if (v == null) return null;
    const w = vals.slice(Math.max(0, i - 2), i + 3).filter(x => x != null).sort((a, b) => a - b);
    return w[Math.floor(w.length / 2)];
  });
}

function renderLatency() {
  const d = LAT.data, el = $("#latBody");
  if (!d.tasks.length) {
    el.innerHTML = `<div class="card empty" style="margin-top:18px">这台服务器还没有延迟测试目标。<br>到首页“设置”→“延迟监测”添加测试目标并勾选这台服务器。</div>`;
    return;
  }
  const cards = d.tasks.map((t, i) => {
    const s = t.stats, off = LAT.hidden.has(t.id);
    const v = s.error ? `<div class="v bad">无法探测${t.kind === "icmp" ? "（这台 VPS 不允许 ping，可改用 TCP）" : "（TCP 测试需要 VPS 装有可用的 curl）"}</div>`
      : `<div class="v num${s.last == null && s.last_loss >= 100 ? " bad" : ""}">${s.last == null && s.last_loss >= 100 ? "超时" : fms(s.last)} · ${s.loss == null ? "—" : s.loss.toFixed(2) + "%"} · ${s.jitter == null ? "—" : s.jitter.toFixed(2)}</div>`;
    return `<button class="lat-card${off ? " off" : ""}" data-id="${t.id}" title="${esc(latTarget(t))}，每 ${t.interval} 秒测一次。点卡片显示/隐藏曲线">
      <i class="c" style="background:${latColor(i)}"></i><b>${esc(t.name)}</b>${v}<span class="tip">ⓘ</span></button>`;
  }).join("");
  const anyData = d.tasks.some(t => t.points.length);
  el.innerHTML = `
    <div class="lat-cards">${cards}</div>
    <div class="lat-tools">
      <button class="btn" id="latAll">全选</button><button class="btn" id="latNone">全不选</button>
      <button class="btn${LAT.smooth ? " on" : ""}" id="latSmooth" title="用相邻 5 个点的中位数代替原值，去掉偶发的尖刺">平滑峰值</button>
      <span class="hint">卡片上依次是：当前延迟 · 丢包率 · 抖动（ms），丢包和抖动按所选时间范围统计</span>
    </div>
    ${anyData ? `<div class="card"><div class="chart-title"><b>延迟（ms）</b></div><div id="latChart"></div><div class="lat-tip num" id="latTip"></div></div>
      <div class="card"><div class="chart-title"><b>丢包率（%）</b></div><div id="lossChart"></div></div>`
    : `<div class="card empty">还没有数据。Agent 收到测试目标后会按设定的间隔开始测量，一两分钟后这里就会出现曲线。<br>如果一直没有，请在这台 VPS 上重新运行一次安装命令，把 Agent 更新到支持延迟监测的版本。</div>`}`;
  el.querySelectorAll(".lat-card").forEach(b => b.onclick = () => {
    const id = +b.dataset.id; LAT.hidden.has(id) ? LAT.hidden.delete(id) : LAT.hidden.add(id); renderLatency();
  });
  $("#latAll").onclick = () => { LAT.hidden.clear(); renderLatency(); };
  $("#latNone").onclick = () => { d.tasks.forEach(t => LAT.hidden.add(t.id)); renderLatency(); };
  $("#latSmooth").onclick = () => { LAT.smooth = !LAT.smooth; renderLatency(); };
  if (anyData) drawLatency();
}

function drawLatency() {
  const d = LAT.data;
  const vis = d.tasks.map((t, i) => [t, i]).filter(([t]) => !LAT.hidden.has(t.id));
  // 所有任务按时间桶对齐成一张表，缺的点留空（曲线断开）
  const tsSet = new Set(); vis.forEach(([t]) => t.points.forEach(p => tsSet.add(p[0])));
  const ts = [...tsSet].sort((a, b) => a - b);
  if (ts.length < 2 || !vis.length) {
    $("#latChart").innerHTML = `<p class="hint" style="padding:30px 0;text-align:center">${vis.length ? "数据点还不够画曲线" : "没有选中的目标"}</p>`;
    $("#lossChart").innerHTML = ""; return;
  }
  const rows = ts.map(t => ({ts: t}));
  vis.forEach(([t]) => {
    const m = new Map(t.points.map(p => [p[0], p]));
    let lat = ts.map(x => m.has(x) ? m.get(x)[1] : null);
    if (LAT.smooth) lat = smooth(lat);
    ts.forEach((x, i) => { rows[i]["l" + t.id] = lat[i]; rows[i]["p" + t.id] = m.has(x) ? m.get(x)[2] : null; });
  });
  const rng = d.end - d.start > 86400 ? "multi" : "1h";
  const onTip = p => {
    const box = $("#latTip"); if (!box) return;
    box.innerHTML = p ? `<span>${fd(p.ts, true).slice(5)}</span>` + vis.map(([t, i]) =>
      `<span><i style="background:${latColor(i)}"></i>${esc(t.name)} ${fms(p["l" + t.id])}${p["p" + t.id] ? `（丢包 ${p["p" + t.id].toFixed(1)}%）` : ""}</span>`).join("") : "";
  };
  $("#latChart").innerHTML = lineChart(rows, vis.map(([t, i]) => ["l" + t.id, t.name, latColor(i)]), v => v.toFixed(0), {onTip}, rng)
    + `<div class="lgd">${vis.map(([t, i]) => `<span><i style="background:${latColor(i)}"></i>${esc(t.name)}</span>`).join("")}</div>`;
  const lossMax = Math.max(0, ...rows.flatMap(r => vis.map(([t]) => r["p" + t.id] || 0)));
  $("#lossChart").innerHTML = lossMax > 0
    ? lineChart(rows, vis.map(([t, i]) => ["p" + t.id, t.name, latColor(i)]), v => v.toFixed(0) + "%", {max: lossMax > 50 ? 100 : niceMax(lossMax * 1.1)}, rng)
    : `<p class="hint" style="padding:16px 0;text-align:center">所选时间范围内没有丢包</p>`;
}

          <option value="icmp" ${t.kind !== "tcp" ? "selected" : ""}>ICMP（ping）</option>

      </div>
      <div class="grid2">
        <label>目标 IP 或域名<input name="host" required maxlength="253" value="${esc(t.host || "")}" placeholder="例如 1.1.1.1 或 example.com"></label>
        <label id="portWrap">端口<input name="port" type="number" min="1" max="65535" value="${t.port || 443}"></label>
      </div>
      <label>测试间隔<select name="interval">${LATM.data.intervals.map(v => `<option value="${v}" ${(t.interval || 60) === v ? "selected" : ""}>每 ${v} 秒</option>`).join("")}</select></label>
      <div>
        <div class="chart-head" style="margin-bottom:6px"><span class="hint">在哪些服务器上测试</span>

        <div class="checks" id="latSrv">${SERVERS.map(s => `<label><input type="checkbox" value="${s.id}" ${sel.has(s.id) ? "checked" : ""}>${esc(s.name)}</label>`).join("")
          || `<p class="hint">还没有服务器</p>`}</div>
      </div>
      <p class="hint">ICMP 需要 VPS 允许普通用户 ping（Debian 11+/Ubuntu 20.04+ 默认允许）；不允许或目标禁 ping 时改用 TCP。修改目标地址、方式或端口后，这个目标的历史数据会清空。</p>
      <p class="err" id="latErr"></p>
      <div class="actions">
        <button class="btn primary" type="submit">保存</button>
        <button class="btn" type="button" id="latCancel">取消</button>
        ${t.id ? `<button class="btn danger" type="button" id="latDel" style="margin-left:auto">删除</button>` : ""}
      </div>
    </form></div>`;
  const f = $("#latForm");
  const sync = () => { $("#portWrap").style.visibility = f.kind.value === "tcp" ? "" : "hidden"; };
  f.kind.onchange = sync; sync();
  $("#selAll").onclick = () => f.querySelectorAll("#latSrv input").forEach(i => i.checked = true);
  $("#selNone").onclick = () => f.querySelectorAll("#latSrv input").forEach(i => i.checked = false);
  $("#latCancel").onclick = () => { LATM.editing = null; renderLatMgr(); };
  if (t.id) $("#latDel").onclick = async () => {
    if (!confirm(`删除“${t.name}”？它的历史延迟数据也会一起删除。`)) return;
    try { await api(`/api/latency/${t.id}`, {method: "DELETE"}); LATM.editing = null; toast("已删除"); await reloadLatMgr(); }
    catch (e) { $("#latErr").textContent = e.message; }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const body = {name: f.name.value, kind: f.kind.value, host: f.host.value.trim(), port: +f.port.value,
                  interval: +f.interval.value, servers: [...f.querySelectorAll("#latSrv input:checked")].map(i => +i.value)};
    try {
      await api(t.id ? `/api/latency/${t.id}` : "/api/latency", {method: t.id ? "PUT" : "POST", body: JSON.stringify(body)});
      LATM.editing = null; toast("已保存"); await reloadLatMgr();
    } catch (err) { $("#latErr").textContent = err.message; }
  };
}

/* ---------- 区间统计（全部服务器） ---------- */
function openRange() {
  CUR = null;
  const presets = [["近 7 天", () => lastDays(7)], ["近 30 天", () => lastDays(30)], ["本月", () => monthRange(0)],
                   ["上月", () => monthRange(-1)], ["近 90 天", () => lastDays(90)]];
  GRANGE = GRANGE || monthRange(0);
  openSheet(`${panelTop("区间统计")}
    <div class="card" style="margin-top:16px">${rangePicker(GRANGE, presets)}
      <p class="hint">统计${curGroup() ? `“${esc(curGroup().name)}”分组里` : "所有"}服务器在这段时间内的流量，按整天计算，含开始和结束两天。${curGroup() ? "要看全部服务器，先在首页切到“全部”。" : ""}</p></div>
    <div id="gResult"></div>`);
  const run = async r => {
    $("#rErr").textContent = "";
    try {
      const d = await api(`/api/range?start=${r.start}&end=${r.end}`);
      GRANGE = r;
      const g = curGroup();
      if (g) {   // 只算当前分组
        d.servers = d.servers.filter(x => g.servers.includes(x.id));
        d.rx = d.servers.reduce((a, x) => a + x.rx, 0); d.tx = d.servers.reduce((a, x) => a + x.tx, 0);
      }
      const sorted = [...d.servers].sort((a, b) => (b.rx + b.tx) - (a.rx + a.tx));
      $("#gResult").innerHTML = `
        <div class="card" style="margin-top:18px">
          <h3 class="num">${rangeLabel(r)}</h3>
          ${statWells([[g ? "分组下行" : "全部下行", fb(d.rx), "rx"], [g ? "分组上行" : "全部上行", fb(d.tx), "tx"]])}
          <div class="table-wrap" style="margin-top:10px">
            <table class="num">
              <thead><tr><th>服务器</th><th>下行</th><th>上行</th><th>合计</th><th>计费用量</th></tr></thead>
              <tbody>${sorted.map(x => `<tr data-id="${x.id}" style="cursor:pointer">
                <td>${esc(x.name)}<br><span class="hint">${BILLING[x.billing]}</span></td>
                <td>${fb(x.rx)}</td><td>${fb(x.tx)}</td><td>${fb(x.rx + x.tx)}</td><td>${fb(x.used)}</td></tr>`).join("")}
                <tr class="total"><td>合计</td><td>${fb(d.rx)}</td><td>${fb(d.tx)}</td><td>${fb(d.rx + d.tx)}</td><td>—</td></tr>
              </tbody>
            </table>
          </div>
          <p class="hint" style="margin-top:10px">点击某台服务器可查看它在这段时间的每日明细。</p>
        </div>`;
      $("#gResult").querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = async () => {
        CUR = +tr.dataset.id; TAB = "range"; DRANGE = {...GRANGE}; await renderDetail();
      });
    } catch (e) { $("#rErr").textContent = e.message; }
  };
  bindRangePicker(presets, run);
  run(GRANGE);
}

/* ---------- 首页排序 ---------- */
function renderOrder() {
  const el = $("#orderList"); if (!el) return;
  if (!SERVERS.length) { el.innerHTML = `<p class="hint">还没有服务器。</p>`; return; }
  el.innerHTML = SERVERS.map((s, i) => `
    <div class="order-row">
      <span class="order-name"><span class="flag">${flag(s.country)}</span><span>${esc(s.name)}</span></span>
      <span class="actions">
        <button class="btn sq" data-mv="top" data-i="${i}" ${i === 0 ? "disabled" : ""} title="置顶" aria-label="置顶">⤒</button>
        <button class="btn sq" data-mv="up" data-i="${i}" ${i === 0 ? "disabled" : ""} title="上移" aria-label="上移">↑</button>
        <button class="btn sq" data-mv="down" data-i="${i}" ${i === SERVERS.length - 1 ? "disabled" : ""} title="下移" aria-label="下移">↓</button>
      </span>
    </div>`).join("");
  el.querySelectorAll("[data-mv]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.i, list = [...SERVERS], [it] = list.splice(i, 1);
    list.splice(b.dataset.mv === "top" ? 0 : b.dataset.mv === "up" ? i - 1 : i + 1, 0, it);
    const before = SERVERS; SERVERS = list; renderOrder(); renderList();
    try { await api("/api/order", {method: "POST", body: JSON.stringify({ids: list.map(s => s.id)})}); }
    catch (e) { SERVERS = before; renderOrder(); renderList(); toast(e.message); }
  });
}

  $("#pwForm").onsubmit = async e => {
    e.preventDefault();

      await api("/api/password", {method: "POST", body: JSON.stringify({old: f.old.value, new: f.new.value})});

    } catch (err) { $("#pwErr").textContent = err.message; }
  };

  const file = $("#restoreFile"), btn = $("#restoreBtn");
  file.onchange = () => { btn.disabled = !file.files.length; $("#restoreErr").textContent = ""; };
  btn.onclick = async () => {
    const f = file.files[0]; if (!f) return;
    if (!confirm(`用“${f.name}”替换当前面板的所有数据？`)) return;
    btn.disabled = true; btn.textContent = "还原中…"; $("#restoreErr").textContent = "";
    try {
      const r = await fetch("/api/restore", {method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/octet-stream", "X-VT-Request": "1"}, body: f});
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) return showLogin();
      if (!r.ok) throw new Error(j.error || r.statusText);
      $("#restoreResult").innerHTML = `已还原 ${j.servers} 台服务器、${j.cycles} 个周期、${j.hourly} 条小时明细。<br>还原前的数据库已保存为 ${esc(j.safety_copy)}。`;
      toast("已还原备份"); file.value = "";
    } catch (e) {
      $("#restoreErr").textContent = e.message;
    } finally {
      btn.textContent = "还原这份备份"; btn.disabled = !file.files.length;
    }
  };
}

/* ---------- 启动 ---------- */
function applySiteName(name) {
  name = name || "VPS 流量";
  document.querySelectorAll(".siteName").forEach(el => el.textContent = name);
  document.title = name;
  const m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (m) m.content = name;
}
fetch("/api/site").then(r => r.json()).then(j => {
  applySiteName(j.name);
  // 主题以面板保存的为准，换设备、换浏览器也一致
  if (j.theme && j.theme !== window.__theme.get()) window.__theme.set(j.theme);
}).catch(() => {});
function showLogin() {
  $("#mainView").hidden = true; $("#loginView").hidden = false;
  $("#sheet").classList.remove("open"); document.body.style.overflow = ""; clearInterval(timer);
}
// 实时刷新：页面可见时按设置的间隔拉取（最快 2 秒）；切到后台或锁屏时暂停，回来立刻刷新
let ticking = false;
function startLive() {
  clearInterval(timer);
  timer = setInterval(liveTick, Math.max(2, META.interval || 3) * 1000);
}
let groupsAt = 0;
async function liveTick() {
  if (document.hidden || ticking || $("#mainView").hidden) return;
  ticking = true;
  try {
    // 分组可能在别的设备上改过，每分钟同步一次
    if (Date.now() - groupsAt > 60000) { groupsAt = Date.now(); await loadGroups(); }
    await refresh(true);
    if (CUR && $("#sheet").classList.contains("open")) await updateDetailHead();
  } catch (e) {} finally { ticking = false; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) liveTick(); });

async function showMain() {
  META = await api("/api/meta");
  applySiteName(META.site_name);
  $("#loginView").hidden = true; $("#mainView").hidden = false;
  await loadGroups(); groupsAt = Date.now();
  await refresh();
  clearInterval(timer);
  startLive();
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  try {
    await api("/api/login", {method: "POST", body: JSON.stringify({password: e.target.password.value})});
    e.target.reset(); $("#loginErr").textContent = "";
    showMain();
  } catch (err) { $("#loginErr").textContent = err.message; }
};
$("#rangeBtn").onclick = openRange;
$("#settingsBtn").onclick = openSettings;
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet(); });
showMain().catch(() => showLogin());
</script>
</body>
</html>
