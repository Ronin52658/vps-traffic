<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPS 流量面板演示</title>
<meta name="theme-color" content="#E4E9F0">
<script>
// 主题：system（跟随系统）/ light（白天）/ dark（夜间）。在页面绘制前就决定，避免闪一下白屏
(function () {
  var pref = "system";
  try { pref = localStorage.getItem("vt-theme") || "system"; } catch (e) {}
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  var root = document.documentElement;
  function systemDark() {
    // 嵌在别的页面里（例如预览）时，优先看外层给的 data-theme
    var host = root.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host === "dark";
    return !!(mq && mq.matches);
  }
  function apply() {
    var dark = pref === "dark" || (pref === "system" && systemDark());
    root.setAttribute("data-mode", dark ? "dark" : "light");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", dark ? "#1D2129" : "#E4E9F0");
  }
  window.__theme = {
    get: function () { return pref; },
    set: function (v) { pref = v; try { localStorage.setItem("vt-theme", v); } catch (e) {} apply(); }
  };
  apply();
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (pref === "system") apply(); });
  if (window.MutationObserver) new MutationObserver(function () { if (pref === "system") apply(); })
    .observe(root, {attributes: true, attributeFilter: ["data-theme"]});
})();
</script>
<style>
:root{
  --bg:#E4E9F0; --hi:#FFFFFF; --lo:#BFC8D6; --ink:#1F2A37; --muted:#5D6B7C;
  --rx:#3A6FE0; --tx:#E58B33; --danger:#D6453A; --ok:#2FA36B; --line:#D2D9E3;
  --raise:7px 7px 16px var(--lo), -7px -7px 16px var(--hi);
  --raise-sm:3px 3px 7px var(--lo), -3px -3px 7px var(--hi);
  --inset:inset 4px 4px 8px var(--lo), inset -4px -4px 8px var(--hi);
  --inset-sm:inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);
  color-scheme: light;
}
/* ---------- 夜间主题 ----------
   深蓝灰底色，阴影收得更紧、更柔，避免暗色拟物常见的“脏”感；
   强调色调亮一档，进度条和指示灯带一点微光，夜里看更清楚又不刺眼 */
html[data-mode="dark"]{
  --bg:#1D2129; --hi:#272C36; --lo:#12151B; --ink:#E3E8EF; --muted:#8E99A8;
  --rx:#78A6FF; --tx:#FFAE62; --danger:#FF7B70; --ok:#4FD69C; --line:#2C323D;
  --raise:6px 6px 14px var(--lo), -5px -5px 12px var(--hi), inset 0 1px 0 rgba(255,255,255,.035);
  --raise-sm:3px 3px 7px var(--lo), -2px -2px 6px var(--hi), inset 0 1px 0 rgba(255,255,255,.03);
  --inset:inset 4px 4px 9px var(--lo), inset -3px -3px 7px var(--hi);
  --inset-sm:inset 2px 2px 5px var(--lo), inset -2px -2px 4px var(--hi);
  color-scheme: dark;
}
html[data-mode="dark"] body{
  background:radial-gradient(1200px 600px at 15% -10%, #252B36 0%, transparent 60%),
             radial-gradient(900px 500px at 100% 0%, #1F2530 0%, transparent 55%), var(--bg);
  background-attachment:fixed;
}
html[data-mode="dark"] .btn.primary{box-shadow:var(--raise-sm),0 4px 14px color-mix(in srgb,var(--rx) 30%,transparent)}
html[data-mode="dark"] .mini .lv0{box-shadow:0 0 6px color-mix(in srgb,var(--ok) 45%,transparent)}
html[data-mode="dark"] .mini .lv1{box-shadow:0 0 6px color-mix(in srgb,var(--tx) 45%,transparent)}
html[data-mode="dark"] .mini .lv2{box-shadow:0 0 6px color-mix(in srgb,var(--danger) 50%,transparent)}
html[data-mode="dark"] .led.on{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 22%,transparent),0 0 10px var(--ok)}
html[data-mode="dark"] .flag img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) brightness(.92)}
html[data-mode="dark"] .sheet{background:rgba(5,7,10,.55)}
html[data-mode="dark"] .toast{background:#E3E8EF;color:#1D2129}
html[data-mode="dark"] .meter .knob,html[data-mode="dark"] .mini .knob{background:var(--hi)}
html[data-mode="dark"] svg.line path[fill="none"]{filter:drop-shadow(0 0 3px rgba(120,166,255,.18))}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.demo-note{font-size:13px;color:var(--muted);border-radius:14px;box-shadow:var(--inset-sm);padding:10px 14px;margin:0 0 18px}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rx);outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:22px 18px 60px}

/* ---------- 基础控件：凸起 / 凹陷 ---------- */
.btn{border:0;background:var(--bg);border-radius:12px;padding:9px 16px;box-shadow:var(--raise-sm);transition:box-shadow .12s}
.btn:active{box-shadow:var(--inset-sm)}
.btn.primary{background:linear-gradient(145deg,var(--rx),color-mix(in srgb,var(--rx) 72%,#000));color:#fff;font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.well{background:var(--bg);border-radius:14px;box-shadow:var(--inset)}
.card{background:var(--bg);border-radius:18px;box-shadow:var(--raise);padding:16px}
input,select{border:0;background:var(--bg);border-radius:10px;padding:10px 12px;box-shadow:var(--inset-sm);width:100%;color:var(--ink)}
input[type=file]{padding:8px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* LED 状态灯 */
.led{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;vertical-align:1px;background:var(--lo);box-shadow:var(--inset-sm)}
.led.on{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 25%,transparent),0 0 8px var(--ok)}

/* ---------- 顶部 ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 26px;flex-wrap:wrap}
header h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.03em}
header .sub{color:var(--muted);font-size:13px;margin-top:8px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:0 4px 16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .knob{width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:1px 1px 3px var(--lo),-1px -1px 3px var(--hi),inset 0 0 0 3px var(--bg),inset 0 0 0 4.5px var(--ink);vertical-align:-2px}

/* ---------- 服务器卡片 ---------- */
.list{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
/* 顶部汇总 */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 0 22px}
.tile{padding:14px 16px;border-radius:16px;background:var(--bg);box-shadow:var(--raise-sm)}
.tile small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.tile strong{font-size:22px;font-weight:700;letter-spacing:.01em}
.tile em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:4px;font-weight:500}
.tile .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
/* 卡片内资源格 */
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:14px 0 12px}
.res .k{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.res .k b{font-weight:650}
.res .k .lbl{color:var(--muted)}
.res .v{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{position:relative;height:9px;border-radius:5px;margin-top:6px;background:var(--bg);box-shadow:var(--inset-sm)}
.mini span{position:absolute;left:2px;top:2px;bottom:2px;border-radius:3px;max-width:calc(100% - 4px)}
.mini .knob{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--bg);box-shadow:1px 1px 3px var(--lo),-1px -1px 3px var(--hi),inset 0 0 0 3px var(--bg),inset 0 0 0 4.5px var(--ink)}
.lv0{background:var(--ok)} .lv1{background:var(--tx)} .lv2{background:var(--danger)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11.5px;color:var(--muted);padding:2px 9px;border-radius:8px;box-shadow:var(--inset-sm);white-space:nowrap}
.flag{display:inline-flex;align-items:center}
.flag img{height:18px;width:auto;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.flag .cc{font-size:11px;font-weight:650;color:var(--muted);padding:1px 6px;border-radius:6px;box-shadow:var(--inset-sm)}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio .well{padding:8px 12px;font-size:12.5px;line-height:1.6;border-radius:12px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trio small{display:block;font-size:11px;color:var(--muted)}
.trio .r{color:var(--rx)} .trio .t{color:var(--tx)}
/* 详情：信息格 */
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info .well{padding:10px 12px;min-width:0}
.info small{display:block;color:var(--muted);font-size:12px}
.info div div{font-size:13.5px;word-break:break-word}
.charts{display:grid;gap:18px;grid-template-columns:1fr;margin-top:18px}
.charts .card{padding:14px}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;font-size:13px}
.chart-title b{font-size:14px}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.lgd i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
svg.line{width:100%;height:auto;display:block;touch-action:pan-y}
.row{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:20px;padding:18px 20px;box-shadow:var(--raise);transition:box-shadow .15s}
.row:active{box-shadow:var(--inset)}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.name{font-weight:650;font-size:16.5px}
.rates{font-size:13px;color:var(--muted)}
.rates b{font-weight:600}
.rates .r{color:var(--rx)} .rates .t{color:var(--tx)}

/* 用量表：凹槽 + 凸起填充 + 时间旋钮 */
.meter{position:relative;height:18px;border-radius:9px;margin:14px 0 10px;background:var(--bg);box-shadow:var(--inset)}
.meter .fill{position:absolute;left:4px;top:4px;bottom:4px;right:4px;display:flex;border-radius:6px;overflow:hidden}
.meter .fill span{height:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.meter .tick{position:absolute;top:3px;bottom:3px;width:2px;border-radius:1px;background:var(--lo)}
.meter .knob{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--bg);box-shadow:2px 2px 5px var(--lo),-2px -2px 5px var(--hi),inset 0 0 0 4px var(--bg),inset 0 0 0 6px var(--ink)}
.meter.over{box-shadow:var(--inset),0 0 0 2px var(--danger)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta .used{color:var(--ink);font-weight:650}
.pace-hot{color:var(--danger);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- 侧滑面板 ---------- */
.sheet{position:fixed;inset:0;background:rgba(20,26,34,.35);display:none;z-index:10}
.sheet.open{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(660px,100%);background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 40px);
  box-shadow:-10px 0 30px rgba(0,0,0,.18);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.panel h2{margin:0;font-size:22px}
.panel .card + .card{margin-top:18px}

/* 分段选择：凹槽里一个凸起滑块 */
.seg{display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--bg);box-shadow:var(--inset);overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:10px;padding:7px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:var(--raise-sm)}
.tabs{margin:20px 0}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:4px 0 4px}
.stats div{padding:12px 14px}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats strong{font-size:18px;font-weight:650}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.readout{font-size:13px;color:var(--muted);min-height:20px;margin:6px 0}
.chart-well{padding:10px 8px 4px}
svg.chart{width:100%;height:auto;display:block}
svg.chart rect.hit{fill:transparent;cursor:pointer}
svg.chart rect.hit:hover{fill:color-mix(in srgb,var(--lo) 40%,transparent)}
svg.chart .bar,svg.chart text{pointer-events:none}

/* 日期区间 */
.range-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.range-row .to{padding-bottom:10px;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.chip{border:0;background:var(--bg);border-radius:20px;padding:6px 13px;font-size:13px;box-shadow:var(--raise-sm)}
.chip:active,.chip.on{box-shadow:var(--inset-sm);color:var(--rx)}

/* 表格 */
.table-wrap{overflow-x:auto;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:140px}
th{color:var(--muted);font-weight:500}
tr.current td,tr.total td{font-weight:650}
tr.total td{border-bottom:0}
.badge{white-space:nowrap;display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;color:var(--muted);box-shadow:var(--inset-sm);margin-left:6px}

form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
pre.cmd{user-select:all;-webkit-user-select:all;border-radius:12px;box-shadow:var(--inset-sm);padding:12px;white-space:pre-wrap;word-break:break-all;font-size:12px;margin:8px 0 12px}
h3{font-size:15px;margin:0 0 6px}
.order{display:grid;gap:10px}
.order-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;box-shadow:var(--inset-sm)}
.order-name{display:flex;align-items:center;gap:8px;min-width:0}
.order-name > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.sq{padding:5px 10px;min-width:36px}
.order .actions{flex-wrap:nowrap;gap:8px}

/* 登录 */
.login{max-width:340px;margin:16vh auto;padding:0 18px}
.login .card{padding:26px}
.login h1{font-size:28px;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:14px;z-index:20;display:none}
@media (max-width:420px){.wrap{padding:18px 14px 50px}.row{padding:16px}.grid2{grid-template-columns:1fr}.tile strong{font-size:19px}}
</style>
</head>
<body>

<div id="loginView" class="login" hidden>
  <div class="card">
    <h1 class="siteName">VPS 流量</h1>
    <p class="hint" style="margin-bottom:18px">请输入面板密码（演示密码：demo）</p>
    <form id="loginForm">
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr"></p>
      <button class="btn primary" type="submit">登录</button>
    </form>
  </div>
</div>

<div id="mainView" class="wrap" hidden>
  <p class="demo-note">这是演示站，数据为模拟并会实时增长。新增、修改、重置都只在本页生效，刷新后恢复原状。</p>
  <header>
    <div>
      <h1 class="siteName">VPS 流量</h1>
    </div>
    <div class="actions">
      <button class="btn" id="rangeBtn">区间统计</button>
      <button class="btn" id="settingsBtn">设置</button>
    </div>
  </header>
  <div class="tiles num" id="tilesTop"></div>
  <div class="legend">
    <span><i style="background:var(--rx)"></i>下行</span>
    <span><i style="background:var(--tx)"></i>上行</span>
    <span><i class="knob"></i>流量周期时间进度</span>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="sheet" id="sheet">
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 演示站模拟后端：拦截 fetch("/api/...")，在浏览器内模拟 server.py 的行为 */
(() => {
  const TZ_OFF = 8 * 3600, H = 3600, D = 86400, GiB = 1024 ** 3, DAYS = 120;
  const nowS = () => Math.floor(Date.now() / 1000);

  // ---- 时间工具（Asia/Shanghai，无夏令时）
  const ld = ts => { const d = new Date((ts + TZ_OFF) * 1000); return {y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours()}; };
  const lm = (y, m, d) => Date.UTC(y, m - 1, d) / 1000 - TZ_OFF;
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const p2 = n => String(n).padStart(2, "0");
  const iso = ts => { const x = ld(ts); return `${x.y}-${p2(x.m)}-${p2(x.d)}`; };
  const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return lm(y, m, d); };
  const dayStart = ts => { const x = ld(ts); return lm(x.y, x.m, x.d); };
  function mb(y, m, day) { while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return lm(y, m, Math.min(day, dim(y, m))); }
  function nextB(s, t) {
    if (s.reset_type === "monthly") { const x = ld(t); for (let i = 0; i < 3; i++) { const b = mb(x.y, x.m + i, s.reset_day); if (b > t) return b; } }
    if (s.reset_type === "interval") { const a = fromIso(s.anchor), n = s.interval_days * D, k = Math.floor((t - a) / n); for (const j of [k, k + 1, k + 2]) { const b = a + j * n; if (b > t) return b; } }
    return null;
  }
  function prevB(s, t) {
    if (s.reset_type === "monthly") { const x = ld(t); for (let i = 0; i > -3; i--) { const b = mb(x.y, x.m + i, s.reset_day); if (b <= t) return b; } }
    if (s.reset_type === "interval") { const a = fromIso(s.anchor), n = s.interval_days * D, k = Math.floor((t - a) / n); for (const j of [k + 1, k, k - 1]) { const b = a + j * n; if (b <= t) return b; } }
    return null;
  }
  const billed = (rx, tx, m) => m === "out" ? tx : m === "in" ? rx : m === "max" ? Math.max(rx, tx) : rx + tx;

  // ---- 可重现的随机数
  let seed = 20261111;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const tok = () => Array.from({length: 32}, () => "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"[Math.floor(Math.random() * 56)]).join("");

  const now0 = nowS(), today = dayStart(now0), first = today - (DAYS - 1) * D;
  const SEEDS = [
    {name: "HK-NAT-01", country: "HK", ip: "203.0.113.24", sysSpec: {os: "Debian GNU/Linux 12 (bookworm)", kernel: "6.1.0-27-cloud-amd64", arch: "x86_64", cpu_model: "AMD EPYC 7B13", cores: 1, virt: "lxc", mem: 512, disk: 5, cpu: 18, memF: .34, diskF: .41, tcp: 140, procs: 38, up: 41}, note: "", quota_gb: 1000, billing: "sum", reset_type: "monthly", reset_day: 1, avg: 21, boost: [11, 2.7], rxShare: 0.71, iface: "eth0", hostname: "hk-nat-01"},
    {name: "JP-Tokyo-IIJ", country: "JP", ip: "198.51.100.77", sysSpec: {os: "Debian GNU/Linux 13 (trixie)", kernel: "6.12.38+deb13-cloud-amd64", arch: "x86_64", cpu_model: "Intel(R) Xeon(R) Gold 6148 CPU @ 2.40GHz", cores: 2, virt: "kvm", mem: 2048, disk: 40, cpu: 6, memF: .22, diskF: .18, tcp: 60, procs: 96, up: 87}, quota_gb: 500, billing: "out", reset_type: "monthly", reset_day: 15, avg: 11, rxShare: 0.32, iface: "ens3", hostname: "tyo-iij", manualSplit: 52},
    {name: "US-LA-CN2GIA", country: "US", ip: "198.51.100.140", sysSpec: {os: "Debian GNU/Linux 12 (bookworm)", kernel: "6.1.0-31-amd64", arch: "x86_64", cpu_model: "Intel(R) Xeon(R) CPU E5-2680 v4 @ 2.40GHz", cores: 2, virt: "kvm", mem: 1024, disk: 20, cpu: 12, memF: .41, diskF: .29, tcp: 210, procs: 84, up: 55}, quota_gb: 2000, billing: "max", reset_type: "monthly", reset_day: 1, avg: 34, rxShare: 0.62, iface: "eth0", hostname: "lax-gia"},
    {name: "SG-Relay", country: "SG", ip: "203.0.113.201", sysSpec: {os: "Debian GNU/Linux 11 (bullseye)", kernel: "5.10.0-33-amd64", arch: "x86_64", cpu_model: "AMD EPYC 7543 32-Core Processor", cores: 1, virt: "openvz", mem: 256, disk: 3, cpu: 4, memF: .48, diskF: .52, tcp: 35, procs: 21, up: 12}, quota_gb: 300, billing: "sum", reset_type: "interval", interval_days: 30, anchorDaysAgo: 77, avg: 6.2, rxShare: 0.5, iface: "venet0", hostname: "sg-relay"},
    {name: "DE-Hetzner-AX", country: "DE", ip: "203.0.113.88", sysSpec: {os: "Debian GNU/Linux 12 (bookworm)", kernel: "6.1.0-28-amd64", arch: "x86_64", cpu_model: "AMD Ryzen 5 3600 6-Core Processor", cores: 12, virt: "none", mem: 65536, disk: 1024, cpu: 23, memF: .37, diskF: .63, tcp: 820, procs: 312, up: 203, swap: 4096}, quota_gb: 20480, billing: "out", reset_type: "monthly", reset_day: 5, avg: 260, rxShare: 0.28, iface: "enp7s0", hostname: "fsn-ax41"},
    {name: "KR-NAT-mini", country: "KR", ip: "198.51.100.9", sysSpec: {os: "Debian GNU/Linux 12 (bookworm)", kernel: "6.1.0-25-cloud-amd64", arch: "x86_64", cpu_model: "Intel Core Processor (Broadwell)", cores: 1, virt: "kvm", mem: 512, disk: 10, cpu: 3, memF: .29, diskF: .36, tcp: 18, procs: 44, up: 9}, quota_gb: 200, billing: "sum", reset_type: "manual", avg: 2.4, rxShare: 0.55, iface: "eth0", hostname: "kr-nat", manualAgo: 37, offlineAgo: 3 * H + 1260},
  ];

  let nextId = 1, nextCycle = 1;
  const S = [];
  for (const sd of SEEDS) {
    const s = {id: nextId++, note: "", reset_day: 1, interval_days: 30, ...sd, token: tok(), hourly: new Map(), cycles: [], created_at: first, last_seen: now0, rate_rx: 0, rate_tx: 0};
    s.anchor = iso(sd.anchorDaysAgo ? today - sd.anchorDaysAgo * D : first);
    if (sd.offlineAgo) s.last_seen = now0 - sd.offlineAgo;
    const stopAt = s.last_seen;
    // 每小时明细
    for (let k = DAYS - 1; k >= 0; k--) {
      const ds = today - k * D;
      const wk = new Date((ds + TZ_OFF) * 1000).getUTCDay();
      let daily = s.avg * (0.72 + 0.56 * rnd()) * (wk === 0 || wk === 6 ? 1.25 : 1);
      if (s.boost && k < s.boost[0]) daily *= s.boost[1];
      for (let h = 0; h < 24; h++) {

        const frac = ts + H > stopAt ? (stopAt - ts) / H : 1;
        const v = daily * GiB * W[h] * (0.65 + 0.7 * rnd()) * frac;
        const rx = Math.round(v * s.rxShare);
        s.hourly.set(ts, [rx, Math.round(v) - rx]);
      }
    }
    // 周期
    if (s.reset_type === "manual") {
      const t = today - sd.manualAgo * D + 14 * H + 23 * 60;
      s.cycles.push({start: first, end: t, closed: true, reason: "manual"}, {start: t, end: null, closed: false});
    } else {
      let b = nextB(s, first);
      while (b <= now0) { const e = nextB(s, b); s.cycles.push({start: b, end: e, closed: e <= now0, reason: e <= now0 ? "auto" : null}); b = e; }
      if (sd.manualSplit) {
        const t = today - sd.manualSplit * D + 10 * H + 47 * 60;
        const i = s.cycles.findIndex(c => c.start <= t && (c.end === null || t < c.end));
        if (i >= 0) { const c = s.cycles[i]; s.cycles.splice(i, 1, {start: c.start, end: t, closed: true, reason: "manual"}, {...c, start: t}); }
      }
    }
    for (const c of s.cycles) {
      c.id = nextCycle++; c.quota_gb = s.quota_gb; c.billing = s.billing; c.rx = 0; c.tx = 0;
      for (const [ts, [rx, tx]] of s.hourly) if (ts >= c.start && (c.end === null || ts < c.end)) { c.rx += rx; c.tx += tx; }
    }
    S.push(s);
  }

  // ---- 实时模拟：每次请求时补上距离上次的流量
  let lastTick = now0;
  function curCycle(s, now) {
    let c = s.cycles.find(x => !x.closed);
    if (!c) { const st = prevB(s, now) ?? now; c = {id: nextCycle++, start: st, end: nextB(s, st), closed: false, rx: 0, tx: 0, quota_gb: s.quota_gb, billing: s.billing}; s.cycles.push(c); }
    while (c.end !== null && now >= c.end) {
      c.closed = true; c.reason = "auto";
      const n = {id: nextCycle++, start: c.end, end: nextB(s, c.end), closed: false, rx: 0, tx: 0, quota_gb: s.quota_gb, billing: s.billing};
      s.cycles.push(n); c = n;
    }
    return c;
  }
  // ---- 系统指标：按时间生成的平滑曲线（同一时刻结果固定），实时图和历史图都由它而来
  const hash = (t, k) => { const x = Math.sin(t * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
  const smooth = (t, k, period) => { const a = Math.floor(t / period), f = t / period - a, u = f * f * (3 - 2 * f); return hash(a, k) * (1 - u) + hash(a + 1, k) * u; };
  const MB = 1048576;
  function metricAt(s, t) {
    const p = s.sysSpec, k = s.id * 7, h = ld(Math.floor(t)).h;
    const wave = 0.6 + 0.8 * W[h] * 24 / 2.2;
    const cpu = Math.min(100, Math.max(0.2, p.cpu * wave * (0.6 + 0.8 * smooth(t, k, 300)) + 6 * (hash(Math.floor(t / 3), k) - 0.5)));
    const memT = p.mem * MB, diskT = p.disk * 1024 * MB, swapT = (p.swap || 0) * MB;
    const base = s.avg * (s.boost ? s.boost[1] : 1) * GiB * W[h] / H;
    const r = base * (0.6 + 0.8 * smooth(t, k + 1, 120)) * (0.85 + 0.3 * hash(Math.floor(t / 3), k + 2));
    return {
      ts: t, cpu: +cpu.toFixed(1), load1: +(cpu / 100 * p.cores * 1.1 + 0.02).toFixed(2),
      mem_used: Math.round(memT * Math.min(.95, p.memF * (0.92 + 0.16 * smooth(t, k + 3, 1800)))), mem_total: memT,
      swap_used: Math.round(swapT * 0.04 * smooth(t, k + 4, 7200)), swap_total: swapT,
      disk_used: Math.round(diskT * p.diskF * (1 + 0.002 * (t - now0) / 86400)), disk_total: diskT,
      rx_rate: r * s.rxShare, tx_rate: r * (1 - s.rxShare),
      tcp: Math.round(p.tcp * wave * (0.8 + 0.4 * smooth(t, k + 5, 240))), udp: Math.round(p.tcp * 0.08 * (0.5 + smooth(t, k + 6, 400))),
      procs: Math.round(p.procs * (0.95 + 0.1 * smooth(t, k + 7, 900))),
    };
  }
  function sysOf(s, now) {
    if (!s.sysSpec) return null;
    const m = metricAt(s, now), p = s.sysSpec;
    return {cpu: m.cpu, load: [m.load1, +(m.load1 * .92).toFixed(2), +(m.load1 * .85).toFixed(2)],

      disk_total: m.disk_total, disk_used: m.disk_used, tcp: m.tcp, udp: m.udp, procs: m.procs,
      uptime: Math.round(p.up * 86400 + (now - now0) + 3600 * 5 + 1234)};
  }
  function metricsSeries(s, rng, now) {
    if (!s.sysSpec) return [];
    const end = s.offlineAgo ? s.last_seen : now;
    const spans = {"1h": 3600, "6h": 21600, "24h": 86400, "7d": 604800};
    const span = spans[rng] || 240, step = rng in spans ? Math.max(60, Math.floor(span / 240 / 60) * 60) : 3;
    const out = [];
    for (let t = end - span; t <= end; t += step) out.push(metricAt(s, rng in spans ? t - t % step : t));
    return out;
  }

  function tick() {
    const now = nowS(), dt = now - lastTick;
    if (dt <= 0) return;
    lastTick = now;
    const h = ld(now).h;
    for (const s of S) {
      if (s.offlineAgo || s.fresh) continue;
      const base = s.avg * (s.boost ? s.boost[1] : 1) * GiB * W[h] / H;
      const mt = metricAt(s, now);
      s.rate_rx = mt.rx_rate; s.rate_tx = mt.tx_rate;
      const rx = Math.round(s.rate_rx * Math.min(dt, 600)), tx = Math.round(s.rate_tx * Math.min(dt, 600));

  }
  tick();

  function summary(s, now) {
    const c = curCycle(s, now), t0 = dayStart(now);

    const online = s.last_seen > 0 && now - s.last_seen <= 180;
    return {
      id: s.id, name: s.name, note: s.note, quota_gb: s.quota_gb, billing: s.billing, reset_type: s.reset_type,
      reset_day: s.reset_day, interval_days: s.interval_days, anchor: s.anchor, online, last_seen: s.last_seen,
      rate_rx: online ? s.rate_rx : 0, rate_tx: online ? s.rate_tx : 0, iface: s.iface || "", hostname: s.hostname || "",
      ip: s.ip || "", country: s.countryManual || s.country || "", country_manual: s.countryManual || "", country_auto: s.country || "", sys: sysOf(s, online ? now : s.last_seen),

  function clean(b, partial) {
    const o = {};
    if ("name" in b || !partial) { const n = String(b.name || "").trim().slice(0, 64); if (!n) throw new Error("名称不能为空"); o.name = n; }
    if ("quota_gb" in b || !partial) o.quota_gb = Math.max(0, +b.quota_gb || 0);

    if ("reset_type" in b || !partial) { if (!["monthly", "interval", "manual"].includes(b.reset_type || "monthly")) throw new Error("重置方式无效"); o.reset_type = b.reset_type || "monthly"; }
    if ("reset_day" in b || !partial) { const d = +b.reset_day || 1; if (d < 1 || d > 31) throw new Error("重置日须在 1–31"); o.reset_day = d; }
    if ("interval_days" in b || !partial) { const n = +b.interval_days || 30; if (n < 1 || n > 3650) throw new Error("间隔天数须在 1–3650"); o.interval_days = n; }

  // 演示站同样需要输入密码；登录状态记在本浏览器，关闭后再打开不用重新登录
const LS_KEY = "vt-demo-login";

  // 演示站主题默认跟随查看者当前的设置

try { loggedIn = Number(localStorage.getItem(LS_KEY) || 0) > Date.now(); } catch (e) {}
const keepLogin = on => { try { on ? localStorage.setItem(LS_KEY, String(Date.now() + 30 * 86400000)) : localStorage.removeItem(LS_KEY); } catch (e) {} };

  async function handle(path, method, body, qs) {

    }
    if (path === "/api/logout") { loggedIn = false; keepLogin(false); return R(200, {ok: true}); }
    if (!loggedIn) return R(401, {error: "未登录"});
    tick();
    if (path === "/api/range") {
      const [start, days] = parseRange(qs, now), end = start + days * D;
      const servers = S.map(s => { let rx = 0, tx = 0; for (const [ts, v] of s.hourly) if (ts >= start && ts < end) { rx += v[0]; tx += v[1]; }
        return {id: s.id, name: s.name, billing: s.billing, rx, tx, used: billed(rx, tx, s.billing)}; });

    }
    if (path === "/api/password") return R(400, {error: "演示站不能修改密码"});
    if (path === "/api/meta") return R(200, {tz: "Asia/Shanghai", now, base_url: "https://traffic.example.com", telegram: true, session_days: 30, interval: IV.interval, idle_interval: IV.idle_interval, site_name: IV.site_name, agent: {repo: "Ronin52658/vps-traffic", commit: "0123456789abcdef0123456789abcdef01234567", install_sha256: "0".repeat(64)}});

      const st = iso(now).replaceAll("-", "") + "-" + p2(ld(now).h) + "0000";
      return R(200, {servers: S.length, cycles: S.reduce((a, s) => a + s.cycles.length, 0), hourly: S.reduce((a, s) => a + s.hourly.size, 0), safety_copy: `traffic.db.before-restore-${st}`});
    }
    if (path === "/api/servers") {
      if (method === "GET") return R(200, S.map(s => summary(s, now)));
      const f = clean(body);
      const s = {id: nextId++, note: "", ...f, anchor: f.anchor || iso(now), token: tok(), hourly: new Map(), cycles: [], created_at: now, last_seen: 0, rate_rx: 0, rate_tx: 0, avg: 0, rxShare: 0.5, fresh: true};
      curCycle(s, now); S.push(s);
      return R(200, {id: s.id, token: s.token});
    }
    const m = path.match(/^\/api\/servers\/(\d+)(?:\/(daily|hourly|cycles|reset|token|metrics))?$/);
    if (!m) return R(404, {error: "not found"});
    const s = S.find(x => x.id === +m[1]), sub = m[2];
    if (!s) return R(404, {error: "服务器不存在"});
    if (!sub && method === "GET") return R(200, {...summary(s, now), token: s.token});
    if (!sub && method === "PUT") {
      Object.assign(s, clean(body, true));
      const c = curCycle(s, now); c.end = nextB(s, now); c.quota_gb = s.quota_gb; c.billing = s.billing; curCycle(s, now);
      return R(200, {ok: true});
    }
    if (!sub && method === "DELETE") { S.splice(S.indexOf(s), 1); return R(200, {ok: true}); }
    if (sub === "daily") {
      const [start, days] = parseRange(qs, now), out = [];
      for (let i = 0; i < days; i++) {
        const a = start + i * D; let rx = 0, tx = 0;
        for (let h = 0; h < 24; h++) { const v = s.hourly.get(a + h * H); if (v) { rx += v[0]; tx += v[1]; } }
        out.push({date: iso(a), rx, tx});
      }
      return R(200, out);
    }
    if (sub === "metrics") return R(200, metricsSeries(s, qs.get("range") || "live", now));
    if (sub === "hourly") {
      const a = fromIso(qs.get("date") || iso(now));
      return R(200, Array.from({length: 24}, (_, h) => { const v = s.hourly.get(a + h * H) || [0, 0]; return {hour: h, rx: v[0], tx: v[1]}; }));
    }
    if (sub === "cycles") {
      curCycle(s, now);
      return R(200, [...s.cycles].sort((a, b) => b.start - a.start || b.id - a.id).map(c => ({
        id: c.id, start: c.start, end: c.end, rx: c.rx, tx: c.tx, used: billed(c.rx, c.tx, c.billing), quota_gb: c.quota_gb,
        billing: c.billing, closed: c.closed, closed_at: c.closed ? c.end : null, reason: c.reason || null})));
    }
    if (sub === "reset" && method === "POST") {
      const c = curCycle(s, now); c.closed = true; c.reason = "manual"; c.end = now;
      s.cycles.push({id: nextCycle++, start: now, end: nextB(s, now), closed: false, rx: 0, tx: 0, quota_gb: s.quota_gb, billing: s.billing});
      return R(200, {ok: true});
    }
    if (sub === "token" && method === "POST") { s.token = tok(); return R(200, {token: s.token}); }
    return R(405, {error: "method not allowed"});
  }
  const today0 = now => dayStart(now);
  function parseRange(qs, now) {
    if (qs.get("start") && qs.get("end")) {
      const a = fromIso(qs.get("start")), b = fromIso(qs.get("end"));
      if (b < a) throw new Error("结束日期不能早于开始日期");
      const days = Math.round((b - a) / D) + 1;
      if (days > 400) throw new Error("区间最长 400 天");
      return [a, days];
    }
    const days = Math.max(1, Math.min(+(qs.get("days") || 30), 400));
    return [today0(now) - (days - 1) * D, days];
  }

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, opt = {}) => {
    const u = new URL(typeof input === "string" ? input : input.url, location.href);
    if (!u.pathname.startsWith("/api/")) return realFetch(input, opt);
    let body = opt.body;
    if (typeof body === "string") { try { body = JSON.parse(body); } catch { body = {}; } }
    await new Promise(r => setTimeout(r, 60 + Math.random() * 120));
    try { return await handle(u.pathname, (opt.method || "GET").toUpperCase(), body || {}, u.searchParams); }
    catch (e) { return R(400, {error: e.message}); }
  };

  // 下载备份在演示站改为提示
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest('a[href="/api/backup"]');
    if (a) { e.preventDefault(); if (typeof toast === "function") toast("演示站不提供下载，正式部署后即可下载备份"); }
  }, true);
})();

const $ = s => document.querySelector(s);
const BILLING = {sum:"双向相加", out:"仅上行", in:"仅下行", max:"取较大方向"};
let META = {}, SERVERS = [], CUR = null, TAB = "monitor", MRANGE = "live", lastCharts = 0, RANGE = 30, timer = null, chartSeq = 0;
let DRANGE = null;   // 详情页区间 {start, end}
let GRANGE = null;   // 区间统计 {start, end}

async function api(path, opt = {}) {
  const r = await fetch(path, {credentials:"same-origin", headers:{"Content-Type":"application/json", "X-VT-Request":"1"}, ...opt});
  if (r.status === 401 && path !== "/api/login" && path !== "/api/password") { showLogin(); throw new Error("未登录"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const GiB = 1024 ** 3;
function fb(n) {
  n = Number(n) || 0;
  const u = ["B","KB","MB","GB","TB","PB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(n >= 100 ? 1 : 2)) + " " + u[i];
}
const fr = n => fb(n).replace(/ (\w+)$/, " $1/s");
const pad = n => String(n).padStart(2, "0");
function fd(ts, withTime) {
  if (!ts) return "—";
  // 按面板时区显示，与重置点计算一致
  const s = new Date(ts * 1000).toLocaleString("sv-SE", {timeZone: META.tz || undefined, hour12: false});
  return withTime ? s.slice(0, 16) : s.slice(0, 10);
}
// 零点只显示日期，手动重置等非零点才带时间
function fdc(ts) { const t = fd(ts, true); return t.endsWith("00:00") ? t.slice(0, 10) : t; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2400); }
function ruleText(s) {
  if (s.reset_type === "monthly") return `每月 ${s.reset_day} 日重置`;
  if (s.reset_type === "interval") return `每 ${s.interval_days} 天重置（自 ${s.anchor} 起）`;
  return "手动重置";
}

/* ---------- 日期工具（YYYY-MM-DD，按面板时区） ---------- */
const todayIso = () => fd(Date.now() / 1000);
function addDays(iso, n) { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000) + 1; }
function monthRange(offset) {
  const [y, m] = todayIso().split("-").map(Number);
  const s = new Date(Date.UTC(y, m - 1 + offset, 1)), e = new Date(Date.UTC(y, m + offset, 0));
  return {start: s.toISOString().slice(0, 10), end: offset === 0 ? todayIso() : e.toISOString().slice(0, 10)};
}
const lastDays = n => ({start: addDays(todayIso(), -(n - 1)), end: todayIso()});
// 周期结束点是下个周期起点的 0 点，所以区间的最后一天要往前推一秒
const cycleRange = c => ({start: fd(c.start), end: c.end ? fd(c.end - 1) : todayIso()});
const rangeLabel = r => `${r.start} 至 ${r.end}（${daysBetween(r.start, r.end)} 天）`;

/* ---------- 用量表 ---------- */
function meter(s) {
  const c = s.cycle, quota = s.quota_gb * GiB;
  const now = Date.now() / 1000;
  let timePct = null;
  if (c.end) timePct = Math.min(100, Math.max(0, (now - c.start) / (c.end - c.start) * 100));
  let parts;
  const scale = quota > 0 ? quota : Math.max(c.used, 1);
  if (s.billing === "sum") parts = [["rx", c.rx], ["tx", c.tx]];
  else if (s.billing === "out") parts = [["tx", c.tx]];
  else if (s.billing === "in") parts = [["rx", c.rx]];
  else parts = c.rx >= c.tx ? [["rx", c.rx]] : [["tx", c.tx]];
  const pct = quota > 0 ? c.used / quota * 100 : null;
  const fills = parts.map(([k, v]) => `<span style="width:${Math.min(100, v / scale * 100)}%;background:var(--${k})"></span>`).join("");
  const ticks = quota > 0 ? [80, 95].map(p => `<span class="tick" style="left:calc(4px + (100% - 8px) * ${p / 100})"></span>`).join("") : "";
  const knob = timePct !== null && quota > 0 ? `<span class="knob" style="left:calc(4px + (100% - 8px) * ${timePct / 100})" title="周期时间已过 ${timePct.toFixed(0)}%"></span>` : "";
  const hot = pct !== null && timePct !== null && pct > timePct + 10 && pct > 20;
  const daysLeft = c.end ? Math.max(0, Math.ceil((c.end - now) / 86400)) : null;
  return `
    ${quota > 0 ? `<div class="meter${pct >= 100 ? " over" : ""}"><div class="fill">${fills}</div>${ticks}${knob}</div>` : `<div style="height:12px"></div>`}
    <div class="meta num">
      <span><span class="used">${fb(c.used)}</span>${quota > 0 ? ` / ${s.quota_gb} GB（<span class="${hot ? "pace-hot" : ""}">${pct.toFixed(1)}%</span>）` : "（未设额度）"}</span>
      <span>${daysLeft !== null ? `${daysLeft} 天后重置（${fd(c.end)}）` : "手动重置"}</span>
    </div>`;
}

const flagSrc = cc => FLAG_DATA[cc] || "data:,";
const flag = cc => /^[A-Z]{2}$/.test(cc || "")
  ? `<img src="${flagSrc(cc)}" alt="${cc}" title="${cc}" loading="lazy" onerror="this.outerHTML='<span class=&quot;cc&quot;>${cc}</span>'">` : "";
const lv = p => p >= 90 ? "lv2" : p >= 70 ? "lv1" : "lv0";
const pctOf = (u, t) => t > 0 ? u / t * 100 : 0;
const clamp = v => Math.min(100, Math.max(0, v));
function upText(sec) {
  if (sec == null) return "";
  const d = Math.floor(sec / 86400), h = Math.floor(sec / 3600);
  return d >= 1 ? `在线 ${d} 天` : h >= 1 ? `在线 ${h} 小时` : `在线 ${Math.max(1, Math.floor(sec / 60))} 分钟`;
}
function durText(sec) {
  if (sec == null) return "—";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return (d ? `${d} 天 ` : "") + (d || h ? `${h} 小时 ` : "") + `${m} 分钟`;
}
const shortOs = os => (os || "").replace("GNU/Linux ", "").replace(/ \(.*\)$/, "");
const mini = (p, cls) => `<div class="mini"><span class="${cls}" style="width:calc((100% - 4px) * ${clamp(p) / 100})"></span></div>`;

function cycleInfo(s) {
  const c = s.cycle, quota = s.quota_gb * GiB, now = Date.now() / 1000;
  const pct = quota > 0 ? c.used / quota * 100 : null;
  const timePct = c.end ? clamp((now - c.start) / (c.end - c.start) * 100) : null;
  const hot = pct !== null && timePct !== null && pct > timePct + 10 && pct > 20;
  const daysLeft = c.end ? Math.max(0, Math.ceil((c.end - now) / 86400)) : null;
  return {c, quota, pct, timePct, hot, daysLeft};
}

function resCell(label, pct, valText, sub) {
  return `<div><div class="k"><span class="lbl">${label}</span><b>${pct == null ? "—" : pct.toFixed(1) + "%"}</b></div>
    ${mini(pct || 0, lv(pct || 0))}<div class="v">${sub}</div></div>`;
}

function card(s) {
  const y = s.online ? s.sys : null, i = s.info || {}, k = cycleInfo(s);
  const memP = y && y.mem_total ? pctOf(y.mem_used, y.mem_total) : null;
  const diskP = y && y.disk_total ? pctOf(y.disk_used, y.disk_total) : null;
  const trafficBar = k.quota > 0
    ? `<div class="mini"><span class="${k.hot ? "lv2" : lv(k.pct)}" style="width:calc((100% - 4px) * ${clamp(k.pct) / 100})"></span>${k.timePct !== null ? `<span class="knob" style="left:calc(2px + (100% - 4px) * ${k.timePct / 100})"></span>` : ""}</div>`
    : `<div class="mini"></div>`;
  const tags = [
    s.online ? (y ? upText(y.uptime) : "在线") : (s.last_seen ? `离线 ${fd(s.last_seen, true).slice(5)}` : "尚未上报"),
    shortOs(i.os), i.cores ? `${i.cores} 核` : "",
  ].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  return `
    <button class="row" data-id="${s.id}">
      <div class="row-head">
        <span class="name"><span class="led ${s.online ? "on" : ""}"></span>${esc(s.name)}</span>
        <span class="flag">${flag(s.country)}</span>
      </div>
      <div class="chiprow">${tags}</div>
      <div class="res num">
        ${resCell("CPU", y ? y.cpu : null, "", y ? y.load.map(v => v == null ? "-" : v.toFixed(2)).join("　") : "—")}
        ${resCell("内存", memP, "", y ? `${fb(y.mem_used)} / ${fb(y.mem_total)}` : "—")}
        ${resCell("硬盘", diskP, "", y ? `${fb(y.disk_used)} / ${fb(y.disk_total)}` : "—")}
        <div><div class="k"><span class="lbl">流量</span><b class="${k.hot ? "pace-hot" : ""}">${k.pct == null ? "∞" : k.pct.toFixed(1) + "%"}</b></div>
          ${trafficBar}<div class="v">${fb(k.c.used)} / ${k.quota > 0 ? s.quota_gb + " GB" : "∞"}</div></div>
      </div>
      <div class="trio num">
        <div class="well"><small>实时网速</small><span class="r">↓ ${s.online ? fr(s.rate_rx) : "—"}</span><br><span class="t">↑ ${s.online ? fr(s.rate_tx) : "—"}</span></div>
        <div class="well"><small>本周期累计</small><span class="r">↓ ${fb(k.c.rx)}</span><br><span class="t">↑ ${fb(k.c.tx)}</span></div>
      </div>
      <div class="meta num" style="margin-top:10px"><span>${k.daysLeft !== null ? `${k.daysLeft} 天后重置（${fd(k.c.end)}）` : "手动重置"}</span><span>${BILLING[s.billing]}</span></div>
    </button>`;
}

function renderTiles() {

/* ---------- 图表 ---------- */
function barChart(data, labelFn, onPick) {
  const id = "c" + (++chartSeq);
  const W = 600, H = 220, padL = 4, padB = 28, n = data.length;
  const max = Math.max(1, ...data.map(d => d.rx + d.tx));
  const bw = (W - padL) / n, gap = Math.min(4, bw * 0.25);
  const step = Math.ceil(n / 6);
  let bars = "", hits = "", labels = "";
  data.forEach((d, i) => {
    const x = padL + i * bw + gap / 2, w = Math.max(0.6, bw - gap);
    const hr = (d.rx / max) * (H - padB - 24), ht = (d.tx / max) * (H - padB - 24);
    const yb = H - padB, r = Math.min(3, w / 2);
    bars += `<rect class="bar" x="${x}" y="${yb - hr}" width="${w}" height="${hr}" fill="var(--rx)"/>`;
    bars += `<rect class="bar" x="${x}" y="${yb - hr - ht}" width="${w}" height="${ht}" rx="${ht > r * 2 ? r : 0}" fill="var(--tx)"/>`;
    hits += `<rect class="hit" data-i="${i}" x="${padL + i * bw}" y="0" width="${bw}" height="${H - padB}"/>`;
    if (i % step === 0) labels += `<text x="${x + w / 2}" y="${H - 6}" font-size="17" text-anchor="middle" fill="var(--muted)">${labelFn(d)}</text>`;
  });
  setTimeout(() => document.querySelectorAll(`#${id} rect.hit`).forEach(r => {
    const f = () => onPick(data[+r.dataset.i]);
    r.onmouseenter = f; r.onclick = f;
  }));
  return `<div class="well chart-well"><svg id="${id}" class="chart" viewBox="0 0 ${W} ${H}" role="img">${hits}${bars}${labels}
    <text x="${W - 2}" y="16" font-size="16" text-anchor="end" fill="var(--muted)">峰值 ${fb(max)}</text></svg></div>`;
}

function statWells(items) {
  return `<div class="stats num">${items.map(([k, v, color]) =>
    `<div class="well"><small>${k}</small><strong${color ? ` style="color:var(--${color})"` : ""}>${v}</strong></div>`).join("")}</div>`;
}

function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * e >= v) return m * e;
  return 10 * e;
}
function lineChart(pts, series, fmt, opt, rng) {
  const id = "l" + (++chartSeq);
  const W = 600, H = 220, L = 86, R = 10, T = 26, B = 28;
  const x0 = pts[0].ts, x1 = pts[pts.length - 1].ts;
  const vals = series.flatMap(([k]) => pts.map(p => +p[k] || 0));
  const ymax = opt.max ?? niceMax(Math.max(...vals) * 1.05);
  const X = t => L + (t - x0) / Math.max(1, x1 - x0) * (W - L - R);
  const Y = v => T + (1 - Math.min(v, ymax) / ymax) * (H - T - B);
  let grid = "", xl = "", lines = "";
  for (let i = 0; i <= 4; i++) {
    const v = ymax * i / 4, y = Y(v);
    grid += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`
      + `<text x="${L - 8}" y="${y + 5}" font-size="14" text-anchor="end" fill="var(--muted)">${fmt(v)}</text>`;
  }
  const tl = t => rng === "7d" ? fd(t, true).slice(5, 10) : fd(t, true).slice(11, 16);
  for (let i = 0; i <= 4; i++) {
    const t = x0 + (x1 - x0) * i / 4;
    xl += `<text x="${X(t)}" y="${H - 6}" font-size="14" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}" fill="var(--muted)">${tl(t)}</text>`;
  }
  series.forEach(([k, , color, dash], si) => {
    let d = "", pen = false;
    for (const p of pts) {
      const v = p[k];
      if (v == null) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${X(p.ts).toFixed(1)},${Y(+v).toFixed(1)}`; pen = true;
    }
    if (opt.area && si === 0 && d)
      lines += `<path d="${d}L${X(x1).toFixed(1)},${Y(0)}L${X(x0).toFixed(1)},${Y(0)}Z" fill="${color}" opacity=".12"/>`;
    lines += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"${dash ? ' stroke-dasharray="6 5" opacity=".6"' : ""}/>`;
  });
  setTimeout(() => {
    const svg = document.getElementById(id); if (!svg) return;
    const guide = svg.querySelector(".guide"), tip = svg.querySelector(".tip");
    const move = e => {
      const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
      if (vx < L || vx > W - R) return;
      const t = x0 + (vx - L) / (W - L - R) * (x1 - x0);
      let p = pts[0]; for (const q of pts) if (Math.abs(q.ts - t) < Math.abs(p.ts - t)) p = q;
      guide.setAttribute("x1", X(p.ts)); guide.setAttribute("x2", X(p.ts)); guide.style.display = "";
      tip.textContent = `${fd(p.ts, true).slice(5)}　` + series.filter(s => !s[3]).map(([k, n]) => `${n} ${p[k] == null ? "-" : fmt(+p[k])}`).join("　");
    };
    svg.onpointermove = move; svg.onpointerdown = move;
    svg.onpointerleave = () => { guide.style.display = "none"; tip.textContent = ""; };
  });
  return `<svg id="${id}" class="line" viewBox="0 0 ${W} ${H}" role="img">${grid}${xl}${lines}
    <line class="guide" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity=".5" style="display:none"/>
    <text class="tip" x="${L}" y="16" font-size="14" fill="var(--ink)"></text></svg>`;
}

function bindRangePicker(presets, onQuery) {

async function tabRange(s) {
  const cycles = await api(`/api/servers/${CUR}/cycles`);
  const cur = cycles.find(c => !c.closed), prev = cycles.find(c => c.closed);
  const presets = [["本周期", () => cycleRange(cur)]];
  if (prev) presets.push(["上个周期", () => cycleRange(prev)]);
  presets.push(["近 7 天", () => lastDays(7)], ["近 30 天", () => lastDays(30)], ["本月", () => monthRange(0)], ["上月", () => monthRange(-1)]);
  DRANGE = DRANGE || cycleRange(cur);
  $("#tabBody").innerHTML = `
    <div class="card">${rangePicker(DRANGE, presets)}
      <p class="hint">按整天统计，含开始和结束两天。小时明细保留 400 天。</p></div>
    <div id="rangeResult"></div>
    <div class="card" id="rHourly" style="margin-top:18px;display:none"></div>`;
  const run = async r => {
    $("#rErr").textContent = "";

      const data = await api(`/api/servers/${CUR}/daily?start=${r.start}&end=${r.end}`);
      DRANGE = r;
      const rx = data.reduce((a, d) => a + d.rx, 0), tx = data.reduce((a, d) => a + d.tx, 0);
      const used = s.billing === "out" ? tx : s.billing === "in" ? rx : s.billing === "max" ? Math.max(rx, tx) : rx + tx;
      $("#rangeResult").innerHTML = `
        <div class="card" style="margin-top:18px">

          ${statWells([["下行", fb(rx), "rx"], ["上行", fb(tx), "tx"], ["合计", fb(rx + tx)], [`计费用量（${BILLING[s.billing]}）`, fb(used)]])}

            $("#rReadout").textContent = `${d.date}　↓ ${fb(d.rx)}　↑ ${fb(d.tx)}　合计 ${fb(d.rx + d.tx)}`;
            loadHourly(d.date, "rHourly");

// Agent 从 GitHub 固定提交安装：先下载 install.sh 并校验 SHA256，通过才运行；install.sh 再校验 agent.sh
function installCmd(token) {
  const b = META.base_url, a = META.agent;
  if (!a) return "# 面板没有配置 Agent 固定版本（agent_pin.json），无法生成安装命令";
  const f = "/root/vps-traffic-install.sh";
  return [
    `curl -fsSL --proto '=https' -o ${f} https://raw.githubusercontent.com/${a.repo}/${a.commit}/install.sh`,
    `echo "${a.install_sha256}  ${f}" | sha256sum -c - && sh ${f} --ref ${a.commit} --server '${b}' --token ${token} --interval ${META.interval || 3}`,
    `rm -f ${f}`,
  ].join("\n");
}
// navigator.clipboard 只在 HTTPS 或 localhost 下可用；用 IP:端口 访问时退回到 execCommand
function copyText(t) {
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  };
  const done = ok => {
    if (ok) return toast("已复制命令");
    const pre = $("#cmd");
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    toast("浏览器不允许自动复制，已帮你选中命令，请长按或 Ctrl+C 复制");
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(t).then(() => done(true), () => done(fallback()));
  else done(fallback());
}

// 实时刷新：页面可见时按设置的间隔拉取（最快 2 秒）；切到后台或锁屏时暂停，回来立刻刷新
let ticking = false;
function startLive() {
  clearInterval(timer);
  timer = setInterval(liveTick, Math.max(2, META.interval || 3) * 1000);
}
async function liveTick() {
  if (document.hidden || ticking || $("#mainView").hidden) return;
  ticking = true;
  try {
    await refresh(true);
    if (CUR && $("#sheet").classList.contains("open")) await updateDetailHead();
  } catch (e) {} finally { ticking = false; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) liveTick(); });

async function showMain() {
  META = await api("/api/meta");
  applySiteName(META.site_name);
  $("#loginView").hidden = true; $("#mainView").hidden = false;
  await refresh();
  clearInterval(timer);
  startLive();
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  try {
    await api("/api/login", {method: "POST", body: JSON.stringify({password: e.target.password.value})});
    e.target.reset(); $("#loginErr").textContent = "";
    showMain();
  } catch (err) { $("#loginErr").textContent = err.message; }
};
$("#rangeBtn").onclick = openRange;
$("#settingsBtn").onclick = openSettings;
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet(); });
showMain().catch(() => showLogin());
</script>
</body>
</html>
